<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1117" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Menu de la semaine</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>(function(){try{var t=localStorage.getItem("menu-theme")||"auto";if(t==="auto")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"minuit":"sauge";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","minuit");}})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root,:root[data-theme="minuit"]{
  --page-solid:#0D1117;--page-glow:rgba(74,222,159,.14);--bg:rgba(255,255,255,.055);--surface:#161B22;--sheet:#161B22;--soft:rgba(255,255,255,.07);
  --ink:#EEF3F8;--mute:#8F9BAB;--line:rgba(255,255,255,.09);--acc:#4ADE9F;--accink:#06241A;--hi:#6EE7B7;--sect:#6EE7B7;
  --nav:rgba(22,27,34,.9);--topbar:#0D1117;--warn:#FF8A80;--today-bg:rgba(74,222,159,.09);--today-line:rgba(74,222,159,.55);--shadow:0 10px 30px rgba(0,0,0,.28)
}
:root[data-theme="aurore"]{
  --page-solid:#0F0D1A;--page-glow:rgba(167,139,250,.2);--bg:rgba(255,255,255,.055);--surface:#181427;--sheet:#181427;--soft:rgba(255,255,255,.07);
  --ink:#F1EEFB;--mute:#9690AD;--line:rgba(255,255,255,.09);--acc:#A78BFA;--accink:#160C33;--hi:#C4B5FD;--sect:#C4B5FD;
  --nav:rgba(24,20,39,.9);--topbar:#0F0D1A;--warn:#FF8A9B;--today-bg:rgba(167,139,250,.11);--today-line:rgba(167,139,250,.6);--shadow:0 10px 30px rgba(0,0,0,.3)
}
:root[data-theme="sauge"]{
  --page-solid:#F3F6F1;--page-glow:rgba(47,143,98,.13);--bg:#F2F5F0;--surface:#FFFFFF;--sheet:#FFFFFF;--soft:rgba(31,107,74,.08);
  --ink:#17251D;--mute:#5E7064;--line:#E1E7DE;--acc:#1F6B4A;--accink:#FFFFFF;--hi:#2A8A5E;--sect:#1F6B4A;
  --nav:rgba(255,255,255,.93);--topbar:#1F6B4A;--warn:#C0392B;--today-bg:#E8F3EC;--today-line:#1F6B4A;--shadow:0 6px 20px rgba(23,37,29,.07)
}
:root[data-theme="soleil"]{
  --page-solid:#FFF7F0;--page-glow:rgba(217,72,15,.12);--bg:#FBEFE5;--surface:#FFFFFF;--sheet:#FFFFFF;--soft:rgba(217,72,15,.09);
  --ink:#2B1A12;--mute:#7E6558;--line:#F1E2D6;--acc:#D9480F;--accink:#FFFFFF;--hi:#D9480F;--sect:#C2410C;
  --nav:rgba(255,255,255,.94);--topbar:#D9480F;--warn:#C0392B;--today-bg:#FFEEE2;--today-line:#D9480F;--shadow:0 6px 20px rgba(43,26,18,.07)
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--page-solid);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:400 16px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin-inline:auto;padding:10px 16px calc(116px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(110% 38% at 50% -4%,var(--page-glow),transparent 70%),var(--page-solid)}
body::after{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--topbar);z-index:60;pointer-events:none}
button{font-family:inherit}
h1{font:800 32px/1.1 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.03em;margin:8px 0 18px}
h1 .gold{display:block;color:var(--hi)}
.hint{color:var(--mute);font-size:13px;margin:4px 0 0}
.note{color:var(--mute);padding:22px 8px;text-align:center}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent}
button,.row,.slot,select{touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#view.enter{animation:rise .22s ease both}
@media (prefers-reduced-motion:reduce){#view.enter{animation:none}}

/* --- cartes jour --- */
.day{background:var(--surface);border:1px solid var(--line);border-radius:22px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.day.today{background:var(--today-bg);border-color:var(--today-line)}
.day.past{opacity:.6}
.dayhead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.dayhead h2{margin:0;font:800 20px "Plus Jakarta Sans",sans-serif;letter-spacing:-.02em}
.pill{display:inline-block;background:var(--acc);color:var(--accink);font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px}
.slotwrap{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.slot{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:12px 16px;min-height:66px;cursor:pointer}
.slot:active{background:var(--soft)}
.ico2{flex:none;width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px}
.slot .txt{flex:1;min-width:0}
.slot .when{display:block;font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.slot .what{display:block;font-weight:700;font-size:17px}
.slot .what.empty{font-weight:600;color:var(--mute)}
.slot small{display:block;color:var(--mute);font-size:13px;font-weight:400}
.slot .go{flex:none;color:var(--mute);font-size:24px;line-height:1}
.recbtn{flex:none;align-self:center;margin-right:12px;border:0;background:var(--soft);color:var(--acc);font-weight:800;font-size:13px;padding:9px 14px;border-radius:999px;cursor:pointer}

/* --- cartes, boutons, puces --- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font:800 18px "Plus Jakarta Sans",sans-serif;letter-spacing:-.02em;display:flex;align-items:center;justify-content:space-between;gap:10px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.kv span:first-child{color:var(--mute);flex:none}
.kv span:last-child{text-align:right;font-weight:700}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mini{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;color:var(--ink);font:inherit;cursor:pointer;min-height:96px;box-shadow:var(--shadow)}
.mini:active{transform:scale(.98)}
.mini .em{font-size:26px;line-height:1.1}
.mini b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.mini span.s{font-size:13px;color:var(--mute)}
.cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--acc);color:var(--accink);border:0;border-radius:22px;padding:15px 16px;margin-bottom:14px;cursor:pointer;font:inherit;box-shadow:var(--shadow)}
.cta:active{transform:scale(.99)}
.cta .em{font-size:30px}
.cta .ct{flex:1;min-width:0}
.cta b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}
.cta small{display:block;font-size:13px;opacity:.75}
.cta .go{font-size:26px;opacity:.7}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:16px;padding:13px 14px;border-radius:16px;cursor:pointer;min-width:0;min-height:50px;transition:transform .1s,background .15s}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.warn{color:var(--warn)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.chip .x{opacity:.6;margin-left:4px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.tag{background:var(--soft);color:var(--ink);font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px}
.addrow{display:flex;gap:8px;margin:0 0 12px}
.addrow input{flex:1}
.addrow .btn{flex:none;width:54px;padding:0;font-size:24px}
.stepper{display:flex;align-items:center;gap:16px;margin:4px 0 6px}
.stepper button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:800;font-size:24px;cursor:pointer}
.stepper b{min-width:28px;text-align:center;font-size:22px}
.prog{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}

/* --- sections, lignes --- */
.aisle{font:800 12px "Plus Jakarta Sans",sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--sect);margin:20px 2px 8px}
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:16px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font-weight:700;font-size:15px;min-height:42px;border-radius:12px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--accink)}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;min-height:56px;cursor:pointer}
.row input,.ichk input{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--mute);flex:none;display:grid;place-content:center;margin:0;background:none}
.row input:checked,.ichk input:checked{background:var(--acc);border-color:var(--acc)}
.row input:checked::after,.ichk input:checked::after{content:"";width:6px;height:11px;border:solid var(--accink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row.done span{text-decoration:line-through;color:var(--mute)}
.mhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:14px 16px;min-height:66px;cursor:pointer}
.mhead .mt{flex:1;min-width:0}
.mhead .mt b{display:block;font-weight:800;font-size:17px}
.mhead small{display:block;color:var(--mute);font-size:13px}
.mhead .chev{flex:none;color:var(--mute);font-size:26px;transition:transform .2s}
.mcard.open .chev{transform:rotate(90deg)}
.mbody{border-top:1px solid var(--line);padding:12px 12px 6px}
.mbody .row{background:var(--bg)}
.mbody .btn{width:100%;margin-bottom:8px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.idea.on{border-color:var(--acc);border-width:2px}
.ichk{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.ichk input{margin-top:2px}
.ichk small{display:block;color:var(--mute);font-size:13px}
.preview{font-size:13px;color:var(--mute);margin:8px 0 0 36px;line-height:1.35}
.assign{display:flex;gap:8px;margin-top:10px}
.assign select{flex:1;min-width:0}
.addbar{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px));margin-top:12px;display:flex;flex-direction:column;gap:8px}
.addbar .btn{width:100%;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* --- champs --- */
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
::placeholder{color:var(--mute);opacity:.85}
textarea{min-height:130px;resize:vertical}
.acts{display:flex;gap:8px;margin-top:14px}

/* --- barre de navigation --- */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(536px,calc(100% - 24px));display:flex;gap:4px;padding:6px;background:var(--nav);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:26px;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--mute);font-weight:700;font-size:11px;padding:7px 4px;border-radius:20px;min-height:56px;cursor:pointer}
#nav button svg{width:24px;height:24px;display:block}
#nav button[aria-current="page"]{background:var(--acc);color:var(--accink)}

/* --- feuilles (formulaire repas + panneau IA) --- */
#sheet,#aisheet{position:fixed;inset:0;background:rgba(0,0,0,0);display:flex;align-items:flex-end;z-index:20;pointer-events:none;transition:background .25s;color:var(--ink)}
#sheet.open,#aisheet.open{background:rgba(0,0,0,.55);pointer-events:auto}
#aisheet{z-index:25}
#sheet form,#aisheet .panel{width:100%;max-width:560px;margin-inline:auto;background:var(--sheet);border-radius:26px 26px 0 0;padding:0;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-bottom:0}
#sheet form{max-height:92vh;max-height:92dvh}
#aisheet .panel{height:88vh;height:88dvh;max-height:92vh}
#sheet.open form,#aisheet.open .panel{transform:translateY(0)}
#sheet h3,#aisheet h3{margin:0 0 6px;font:800 24px "Plus Jakarta Sans",sans-serif;letter-spacing:-.025em}
.grab{flex:none;width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 6px}
.sh-body{flex:1;min-height:0;overflow:auto;padding:4px 18px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-foot{flex:none;margin:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--sheet)}
.sh-foot .btn{min-height:56px;font-size:17px;border-radius:18px}
.sh-foot .btn.main{flex:1.6}
.sh-foot .btn.warn{flex:.8}
.rec{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:8px;color:var(--ink);font:inherit;cursor:pointer}
.rec:active{transform:scale(.99)}
.rec strong{display:block;font-weight:800}
.rec small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.ingl{padding:9px 0;border-top:1px solid var(--line)}
.steps{margin:0 0 8px;padding-left:22px}
.steps li{margin-bottom:10px}
.stepl{margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:70;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header id="top"></header>
<main id="view"></main>
<nav id="nav" aria-label="Navigation"></nav>

<div id="sheet" aria-hidden="true">
  <form id="form">
    <div class="grab"></div>
    <div class="sh-body">
    <h3 id="sh-title"></h3>
    <label for="f-name">Repas</label>
    <input type="text" id="f-name" placeholder="Ex. : pâtes à la tomate" autocomplete="off">
    <div class="bar" style="margin:10px 0 0"><button type="button" class="btn" id="f-search">Chercher sur Marmiton</button><button type="button" class="btn main" id="f-ai">Chercher sur AI Hub</button></div>

    <label for="f-url">Lien d’une recette</label>
    <div style="display:flex; gap:8px; margin-bottom: 8px;">
      <input type="text" id="f-url" inputmode="url" placeholder="https://www.marmiton.org/…" autocomplete="off" style="flex:1;">
      <button type="button" class="btn main" id="f-paste" style="flex:0 0 auto; padding:10px 16px; font-weight:800;">Coller</button>
    </div>

    <div class="bar" style="margin:8px 0 0"><button type="button" class="btn" id="f-import">Importer les ingrédients</button></div>

    <!-- Mode reste + favoris -->
    <div class="bar" style="margin:12px 0 4px; gap:8px; flex-wrap:wrap">
      <button type="button" class="chip" id="f-leftover" aria-pressed="false">♻️ C’est un reste</button>
      <button type="button" class="chip" id="f-fav" aria-pressed="false">☆ Favori</button>
    </div>
    <p class="hint" id="f-leftover-hint" hidden>Les ingrédients de ce repas ne seront <strong>pas</strong> ajoutés à la liste de courses.</p>

    <label for="f-ing">Ingrédients (un par ligne)</label>
    <textarea id="f-ing" placeholder="400 g de pâtes&#10;3 tomates&#10;1 oignon"></textarea>
    <label for="f-steps">Étapes (facultatif)</label>
    <textarea id="f-steps" style="min-height:90px" placeholder="1. Faire cuire les pâtes…"></textarea>
    <div class="bar" style="margin:12px 0 0">
      <div style="flex:1"><label for="f-base" style="margin-top:0">Recette pour</label><input type="number" id="f-base" min="1" max="99" inputmode="numeric"></div>
      <div style="flex:1"><label for="f-ppl" style="margin-top:0">Je cuisine pour</label><input type="number" id="f-ppl" min="1" max="99" inputmode="numeric"></div>
    </div>
    <p class="hint">Quantité d’abord, puis l’ingrédient. Les doublons s’additionnent dans la liste de courses.</p>
    </div>
    <div class="acts sh-foot">
      <button type="button" class="btn warn" id="f-clear">Vider</button>
      <button type="button" class="btn" id="f-cancel">Fermer</button>
      <button type="submit" class="btn main">Enregistrer</button>
    </div>

  </form>
</div>
<div id="aisheet" aria-hidden="true"><div class="panel"><div class="grab"></div><div id="ai-panel" class="sh-body"></div><div id="ai-foot" class="acts sh-foot" hidden></div></div></div>
<div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
/* Menu de la semaine – v6 (nouvelle interface chaleureuse + sync Firebase) */
var DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
var SLOTS=[["m","Midi"],["s","Soir"]];
var SLOT_ICO={m:"☀️",s:"🌙"};
var KEY="menu-semaine-v1";
var DKEY="menu-draft";
var FAMILY_KEY="menu-family-code";

var view=document.getElementById("view"),nav=document.getElementById("nav");
var tab="home",editKey=null;

function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
/* ---------- apparence (propre à chaque appareil, non synchronisée) ---------- */
var THEME_KEY="menu-theme";
var THEMES=[["auto","Auto"],["minuit","Minuit"],["aurore","Aurore"],["sauge","Sauge"],["soleil","Soleil"]];
var THEME_BAR={minuit:"#0D1117",aurore:"#0F0D1A",sauge:"#1F6B4A",soleil:"#D9480F"};
function getTheme(){try{return localStorage.getItem(THEME_KEY)||"auto";}catch(e){return "auto";}}
function applyTheme(t){
  var r=t==="auto"?((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"minuit":"sauge"):t;
  if(!THEME_BAR[r])r="minuit";
  document.documentElement.setAttribute("data-theme",r);
  var m=document.getElementById("meta-theme");if(m)m.setAttribute("content",THEME_BAR[r]);
}
function setTheme(t){try{localStorage.setItem(THEME_KEY,t);}catch(e){}applyTheme(t);}
try{if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){if(getTheme()==="auto")applyTheme("auto");});}catch(e){}
applyTheme(getTheme());

function todayIdx(){return (new Date().getDay()+6)%7;}
function monthName(){return ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"][new Date().getMonth()];}
function dateStr(){var s=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});return s.charAt(0).toUpperCase()+s.slice(1);}
/* clé sûre pour Firebase (pas de . # $ [ ] /) */
function ck(id){return String(id).replace(/[.#$\[\]\/]/g,"_");}

/* ---------- état ---------- */
function toArr(x){
  if(Array.isArray(x))return x.filter(function(v){return v!==null&&v!==undefined;});
  if(x&&typeof x==="object")return Object.keys(x).sort(function(a,b){return a-b;}).map(function(k){return x[k];});
  return [];
}
function normState(s){
  if(!s||typeof s!=="object")s={};
  if(!s.meals||typeof s.meals!=="object")s.meals={};
  Object.keys(s.meals).forEach(function(k){if(/-p$/.test(k))delete s.meals[k];}); /* ancienne ligne « Matin » supprimée */
  if(!s.checked||typeof s.checked!=="object")s.checked={};
  if(!s.people)s.people=2;
  s.favs=toArr(s.favs).map(function(f){f.ing=toArr(f.ing);f.steps=toArr(f.steps);return f;});
  s.appliances=toArr(s.appliances);
  var P=(s.profile&&typeof s.profile==="object")?s.profile:{};
  P.avoid=toArr(P.avoid);P.wishes=toArr(P.wishes);s.profile=P;
  return s;
}
/* signature stable (ignore l'ordre des clés et les conteneurs vides, comme Firebase) */
function stable(o){
  if(o===null||o===undefined)return undefined;
  if(Array.isArray(o)){var a=o.map(stable).filter(function(x){return x!==undefined;});return a.length?a:undefined;}
  if(typeof o==="object"){var r={},n=0;Object.keys(o).sort().forEach(function(k){var v=stable(o[k]);if(v!==undefined){r[k]=v;n++;}});return n?r:undefined;}
  return o;
}
function sig(o){return JSON.stringify(stable(o)||{});}

function generateFamilyCode(){
  var chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",code="";
  for(var i=0;i<6;i++)code+=chars[Math.floor(Math.random()*chars.length)];
  return code;
}
function startSync(code){
  if(!authReady&&!auth.currentUser){
    toast("Connexion en cours… réessaie dans 2 secondes");
    setTimeout(function(){startSync(code);},1500);
    return;
  }
  code=String(code||"").trim().toUpperCase();
  if(!code){toast("Code invalide");return;}
  familyCode=code;
  localStorage.setItem(FAMILY_KEY,code);
  syncReady=true;
  db.ref("families/"+code+"/data").off();
  db.ref("families/"+code+"/data").on("value",function(snap){
    var remote=snap.val();
    if(!remote){
      db.ref("families/"+code+"/data").set(state).then(function(){toast("Espace créé · code "+code);})
        .catch(function(err){console.warn(err);toast("Erreur écriture : "+(err.message||err.code||""));});
      return;
    }
    remote=normState(remote);
    if(sig(remote)===sig(state))return; /* écho de nos propres modifications */
    applyingRemote=true;
    state=remote;
    try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
    applyingRemote=false;
    render();
  },function(err){
    console.warn("Sync listen error",err);
    toast("Impossible de synchroniser : "+(err.message||err.code||""));
  });
}
function leaveFamily(){
  if(familyCode)db.ref("families/"+familyCode+"/data").off();
  familyCode=null;
  localStorage.removeItem(FAMILY_KEY);
  syncReady=false;
  toast("Synchronisation désactivée");
  render();
}
auth.onAuthStateChanged(function(user){
  if(user){
    authReady=true;
    if(familyCode&&!syncReady)startSync(familyCode);
  }
});

var RX=/^(\d+(?:[.,]\d+)?|\d\/\d|[½¼¾])\s*(kg|g|l|ml|cl)?\s+(?:de\s+|d’|d')?(.+)$/i;
function toNum(x){var F={"½":.5,"¼":.25,"¾":.75};if(F[x])return F[x];if(x.indexOf("/")>0){var a=x.split("/");return (+a[0])/(+a[1]||1);}return parseFloat(String(x).replace(",","."))||0;}
function buildList(){
  var map={};
  Object.keys(state.meals).forEach(function(k){
    var m=state.meals[k];
    if(!m||!m.ing||m.leftover)return; /* les restes n’entrent pas dans la liste de courses */
    var f=(m.people&&m.base)?m.people/m.base:1;
    m.ing.split("\n").forEach(function(line){
      line=line.trim();if(!line)return;
      var q=null,u="",n=line,r=RX.exec(line);
      if(r){q=toNum(r[1]);u=(r[2]||"").toLowerCase();n=r[3].trim();}
      if(u==="kg"){q*=1000;u="g";}else if(u==="l"){q*=1000;u="ml";}else if(u==="cl"){q*=10;u="ml";}
      var id=n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")+"|"+u;
      if(!map[id])map[id]={id:id,name:n,unit:u,qty:0};
      if(q!=null)map[id].qty+=q*f;
    });
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return a.name.localeCompare(b.name,"fr");});
}

function fmt(it){
  var q=it.qty,u=it.unit;if(!q)return it.name;if(!u)q=Math.ceil(q-1e-9);
  if(u==="g"&&q>=1000){q=q/1000;u="kg";}
  if(u==="ml"&&q>=1000){q=q/1000;u="l";}
  q=Math.round(q*100)/100;
  var s=String(q).replace(".",",");
  if(u&&!/^(de |d’|d')/i.test(it.name))return s+" "+u+" "+(/^(h(?!aricot|achis|omard|arissa|alloumi|oumous|ot)|[aeiouyàâäéèêëîïôöùûü])/i.test(it.name)?"d’":"de ")+it.name;
  return s+(u?" "+u:"")+" "+it.name;
}
function listStats(){
  var items=buildList();
  var done=items.filter(function(it){return state.checked[ck(it.id)];}).length;
  return {items:items,total:items.length,done:done,left:items.length-done};
}

];
function aisle(n){
  var tk=n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/[^a-z0-9]+/);
  for(var i=0;i<KW.length;i++){
    var ws=KW[i].split(" ");
    for(var j=0;j<ws.length;j++){
      var w=ws[j];
      if(tk.some(function(t){return t===w||t===w+"s"||t===w+"x"||t.startsWith(w)&&t.length<=w.length+2;}))return AISLES[i];
    }
  }
  return AISLES[6];
}

var openMeals={};
function parseLine(line){
  line=line.trim();var q=null,u="",n=line,r=RX.exec(line);
  if(r){q=toNum(r[1]);u=(r[2]||"").toLowerCase();n=r[3].trim();}
  if(u==="kg"){q*=1000;u="g";}else if(u==="l"){q*=1000;u="ml";}else if(u==="cl"){q*=10;u="ml";}
  return {id:n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")+"|"+u,name:n,unit:u,q:q};
}
function syncChecks(id){
  var on=!!state.checked[ck(id)];
  Array.prototype.forEach.call(view.querySelectorAll(".row"),function(r){
    if(r.dataset.id===id){r.classList.toggle("done",on);var c=r.querySelector("input");if(c)c.checked=on;}
  });
  Array.prototype.forEach.call(view.querySelectorAll(".mcard"),function(c){if(c._upd)c._upd();});
  var s=listStats(),pr=view.querySelector(".prog i"),pl=view.querySelector("#prog-label");
  if(pr)pr.style.width=(s.total?Math.round(100*s.done/s.total):0)+"%";
  if(pl)pl.textContent=s.left+" article"+(s.left>1?"s":"")+" restant"+(s.left>1?"s":"")+" sur "+s.total;
}
function ingRow(id,text){
  var row=el("label","row"+(state.checked[ck(id)]?" done":""));row.dataset.id=id;
  var cb=document.createElement("input");cb.type="checkbox";cb.checked=!!state.checked[ck(id)];
  cb.addEventListener("change",function(){
    if(cb.checked)state.checked[ck(id)]=1;else delete state.checked[ck(id)];
    save();syncChecks(id);
  });
  row.appendChild(cb);row.appendChild(el("span","",text));return row;
}

var MEALDB="https://www.themealdb.com/api/json/v1/1/";
function trList(list,from,to){
  var chunks=[],cur=[],len=0;
  list.forEach(function(t){if(len+t.length>380&&cur.length){chunks.push(cur);cur=[];len=0;}cur.push(t);len+=t.length+1;});
  if(cur.length)chunks.push(cur);
  return Promise.all(chunks.map(function(c){
    return fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(c.join("\n"))+"&langpair="+from+"|"+to)
      .then(function(r){return r.json();})
      .then(function(d){
        var out=d&&d.responseStatus===200&&d.responseData?String(d.responseData.translatedText).split("\n"):null;
        return out&&out.length===c.length?out:c;
      }).catch(function(){return c;});
  })).then(function(parts){return [].concat.apply([],parts);});
}
var ideas={q:"",chips:[],list:null,loading:false,sel:{},preview:{},all:null,off:0,t:1};
var rawCache={};
function getMeal(id){
  if(rawCache[id])return Promise.resolve(rawCache[id]);
  return fetch(MEALDB+"lookup.php?i="+encodeURIComponent(id))
    .then(function(x){if(!x.ok)throw 0;return x.json();})
    .then(function(d){var m=(d.meals||[])[0]||null;if(m)rawCache[id]=m;return m;})
    .catch(function(){return null;});
}
function countIng(m){var n=0;for(var i=1;i<=20;i++)if((m["strIngredient"+i]||"").trim())n++;return n;}
function api(p){
  return getMeal(p.id).then(function(m){
    if(!m)return {};
    var lines=[];
    for(var i=1;i<=20;i++){var g=(m["strIngredient"+i]||"").trim(),q=(m["strMeasure"+i]||"").trim();if(g)lines.push((q+" "+g).trim());}
    return trList([m.strMeal].concat(lines),"en","fr").then(function(t){return {name:t[0],ingredients:t.slice(1)};});
  });
}
function nextFree(taken){
  for(var d=0;d<7;d++){
    for(var j=SLOTS.length-1;j>=0;j--){
      var k=d+"-"+SLOTS[j][0];
      if(!state.meals[k]&&!taken[k])return {day:d,slot:SLOTS[j][0]};
    }
  }
  return {day:0,slot:SLOTS[SLOTS.length-1][0]};
}
function terms(){return ideas.q.split(/[,;\n]+/).map(function(t){return t.trim();}).filter(Boolean).slice(0,4);}
function syncQ(){ideas.q=ideas.chips.join(", ");}

function searchIdeas(){
  var ts=terms();
  if(!ts.length){toast("Ajoute au moins un ingrédient");return;}
  ideas.loading=true;ideas.list=null;ideas.sel={};ideas.preview={};ideas.all=null;ideas.off=0;ideas.t=ts.length;renderIdeas();
  trList(ts,"fr","en").then(function(en){
    return Promise.all(en.map(function(t){
      return fetch(MEALDB+"filter.php?i="+encodeURIComponent(t.toLowerCase().trim().replace(/\s+/g,"_")))
        .then(function(x){return x.json();}).then(function(d){return d.meals||[];}).catch(function(){return [];});
    }));
  }).then(function(res){
    var map={};
    res.forEach(function(ms){ms.forEach(function(m){
      if(!map[m.idMeal])map[m.idMeal]={id:m.idMeal,en:m.strMeal,hits:0};
      map[m.idMeal].hits++;
    });});
    ideas.all=Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return b.hits-a.hits;});
    ideasBatch();
  }).catch(function(){ideas.loading=false;ideas.list=[];renderIdeas();toast("Recherche impossible (réseau ou quota)");});
}
function ideasBatch(){
  var all=ideas.all||[];
  if(!all.length){ideas.list=[];ideas.loading=false;renderIdeas();return;}
  if(ideas.off>=all.length)ideas.off=0;
  var chunk=all.slice(ideas.off,ideas.off+18);ideas.off+=18;
  ideas.loading=true;ideas.list=null;ideas.sel={};ideas.preview={};renderIdeas();
  Promise.all(chunk.map(function(a){
    return getMeal(a.id).then(function(m){a.n=m?countIng(m):10;a.mc=m?m.strCategory:"";return a;}).catch(function(){a.n=10;a.mc="";return a;});
  })).then(function(arr){
    return trList(arr.map(function(a){return a.en;}),"en","fr").then(function(names){
      arr.forEach(function(a,i){a.name=names[i];a.cat=normCat(a.mc,a.name);a.t=ideas.t;});return arr;
    });
  }).then(function(arr){ideas.list=arr;ideas.loading=false;renderIdeas();})
  .catch(function(){ideas.loading=false;ideas.list=[];renderIdeas();toast("Recherche impossible (réseau ou quota)");});
}
function addSelected(){
  var ids=Object.keys(ideas.sel);if(!ids.length)return;
  var keys={},dup=false,over=0;
  ids.forEach(function(id){var s=ideas.sel[id],k=s.day+"-"+s.slot;if(keys[k])dup=true;keys[k]=id;if(state.meals[k])over++;});
  if(dup){toast("Deux recettes sont sur le même créneau");return;}
  if(over&&!confirm(over+(over>1?" créneaux sont déjà remplis":" créneau est déjà rempli")+". Les remplacer ?"))return;
  toast("Ajout en cours…");
  Promise.all(ids.map(function(id){return api({id:id}).then(function(r){return {id:id,r:r};});})).then(function(rs){
    var n=0;
    rs.forEach(function(x){
      if(!x.r||!x.r.ingredients)return;
      var s=ideas.sel[x.id];
      state.meals[s.day+"-"+s.slot]={name:x.r.name,ing:x.r.ingredients.join("\n"),steps:"",base:4,people:state.people||2};
      n++;
    });
    save();ideas.sel={};go("week");toast(n+(n>1?" repas ajoutés":" repas ajouté"));
  }).catch(function(){toast("Ajout impossible");});
}
function autoFill(){
  var ids=Object.keys(ideas.sel);if(!ids.length)return;
  var taken={};
  Object.keys(ideas.sel).forEach(function(id){var s=ideas.sel[id];taken[s.day+"-"+s.slot]=1;});
  ids.forEach(function(id){
    var s=ideas.sel[id];
    if(!state.meals[s.day+"-"+s.slot]){}
    else{var f=nextFree(taken);ideas.sel[id]=f;taken[f.day+"-"+f.slot]=1;}
  });
  renderIdeas();
  toast("Créneaux mis à jour");
}

function loadPreview(id,container){
  if(ideas.preview[id]){container.textContent=ideas.preview[id];return;}
  container.textContent="Chargement…";
  getMeal(id).then(function(m){
    if(!m){container.textContent="";return;}
    var lines=[];
    for(var i=1;i<=6;i++){var g=(m["strIngredient"+i]||"").trim();if(g)lines.push(g);}
    var txt=lines.join(", ")+(countIng(m)>6?"…":"");
    trList([txt],"en","fr").then(function(t){
      ideas.preview[id]=t[0]||txt;
      container.textContent=ideas.preview[id];
    });
  });
}

function fetchPage(u,i){

  return fetch(PROXIES[i]+encodeURIComponent(u),{signal:AbortSignal.timeout?AbortSignal.timeout(12000):undefined})
    .then(function(r){if(!r.ok)throw 0;return r.text();})

function parseRecipe(html){
  var re=/<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/gi,m,out=null;
  while((m=re.exec(html))){try{
    var d=JSON.parse(m[1]),list=Array.isArray(d)?d:(d["@graph"]||[d]);
    list.forEach(function(x){var t=x["@type"];if(t==="Recipe"||(Array.isArray(t)&&t.indexOf("Recipe")>-1))out={name:x.name,ing:x.recipeIngredient||[],yld:x.recipeYield};});
  }catch(e){}}
  return out;
}

var CATS=["Entrée","Plat","Dessert"],CATPL={"Entrée":"Entrées","Plat":"Plats","Dessert":"Desserts"};
function catOfName(n){
  var s=String(n||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(/(gateau|mousse|cookie|brownie|crepe|flan|glace|sorbet|tiramisu|panna cotta|compote|clafoutis|muffin|beignet|riz au lait|charlotte|macaron|pudding|fondant|biscuit|salade de fruit|dessert|creme brulee|creme caramel|tarte (aux|au) (pomme|fraise|citron|poire|chocolat|myrtille|abricot|framboise|prune|cerise|fruit)|tarte tatin|cheesecake|pie\b|cake)/.test(s))return "Dessert";
  if(/(soupe|veloute|salade|gaspacho|houmous|tapenade|carpaccio|tartare|terrine|bruschetta|verrine|accras|rillettes|entree)/.test(s))return "Entrée";
  return "Plat";
}
function normCat(c,name){
  var s=String(c||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(s.indexOf("entr")===0||s.indexOf("starter")===0||s.indexOf("side")===0||s.indexOf("apero")===0)return "Entrée";
  if(s.indexOf("dessert")===0)return "Dessert";
  if(s.indexOf("plat")===0||s.indexOf("main")===0)return "Plat";
  return catOfName(name);
}
function keyTitle(k){
  var p=k.split("-"),sl=SLOTS.filter(function(x){return x[0]===p[1];})[0];
  return DAYS[+p[0]]+(sl?", "+sl[1].toLowerCase():"");
}
function scaledLine(line,f){
  line=line.trim();var r=RX.exec(line);if(!r||f===1)return line;
  var q=toNum(r[1])*f,u=(r[2]||"").toLowerCase(),n=r[3].trim();
  if(u==="kg"){q*=1000;u="g";}else if(u==="l"){q*=1000;u="ml";}else if(u==="cl"){q*=10;u="ml";}
  return fmt({qty:q,unit:u,name:n});
}

var AI_PROXY="https://ai-hub-proxy.pasquet-gregory.workers.dev";

var CUISINES=["française traditionnelle","italienne","asiatique","méditerranéenne","mexicaine","réconfortante de saison","légère et fraîche","du monde"];

function aiAbort(bucket){bucket.splice(0).forEach(function(c){try{c.abort();}catch(e){}});}
function aiAbortAll(){aiAbort(aiS.lctls);aiAbort(aiS.dctls);aiAbort(aiS.fctls);aiS.rl++;aiS.rd++;aiS.rf++;aiS.running=0;}

/* Appel au proxy en flux : onText reçoit le texte au fur et à mesure */
function aiStream(prompt,onText,bucket){
  var ctl=new AbortController();bucket.push(ctl);
  var t=setTimeout(function(){ctl.abort();},80000);
  function done(){clearTimeout(t);var i=bucket.indexOf(ctl);if(i>-1)bucket.splice(i,1);}
  return fetch(AI_PROXY,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({mode:AI_MODE,messages:[{role:"user",content:prompt}],stream:true}),signal:ctl.signal})
  .then(function(r){
    if(!r.ok)return r.text().then(function(x){
      var msg="Erreur AI ("+r.status+")";
      if(r.status===401||r.status===403)msg="AI Hub : connexion requise (auth manquante sur le proxy)";
      else if(r.status===429)msg="AI Hub : trop de requêtes, réessaie dans un moment";
      else if(r.status>=500)msg="AI Hub momentanément indisponible";
      else{try{var j=JSON.parse(x);if(j.error)msg=String(j.error).slice(0,120);}catch(e){}}
      throw new Error(msg);
    });
    var acc="",raw="",buf="";
    function eat(line){
      var l=line.trim();if(l.indexOf("data:")!==0)return;
      var d=l.slice(5).trim();if(!d||d==="[DONE]")return;
      try{var j=JSON.parse(d);var c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(c){acc+=c;if(onText)onText(acc);}}catch(e){}
    }
    function fin(){
      if(!acc){try{var j2=JSON.parse(raw);acc=(j2.choices&&j2.choices[0]&&j2.choices[0].message&&j2.choices[0].message.content)||"";if(acc&&onText)onText(acc);}catch(e){}}
      if(!acc)throw new Error("Réponse vide");
      return acc;
    }
    if(!r.body||!r.body.getReader)return r.text().then(function(x){raw=x;x.split("\n").forEach(eat);return fin();});
    var rd=r.body.getReader(),dec=new TextDecoder();
    function pump(){

      return rd.read().then(function(res){
        if(res.done){if(buf)eat(buf);return fin();}
        var chunk=dec.decode(res.value,{stream:true});raw+=chunk;buf+=chunk;
        var lines=buf.split("\n");buf=lines.pop();lines.forEach(eat);
        return pump();
      });
    }
    return pump();
  }).then(function(x){done();return x;},function(e){
    done();
    var msg=(e&&e.message)||"Réseau";
    if(e&&e.name==="AbortError")msg="Délai dépassé";
    else if(/Failed to fetch|Load failed|NetworkError|network/i.test(msg))msg="Connexion AI impossible (réseau ou proxy)";
    throw new Error(msg);
  });
}

function aiClean(text){return String(text).replace(/<think>[\s\S]*?(?:<\/think>|$)/gi,"").replace(/```json|```/gi,"");}
/* objets { } complets d'un tableau JSON en cours d'arrivée */
function aiObjs(text){
  text=aiClean(text);
  var i=text.indexOf("[");if(i<0)return [];
  var out=[],depth=0,start=-1,inStr=false,esc=false;
  for(var k=i+1;k<text.length;k++){
    var c=text[k];
    if(inStr){if(esc)esc=false;else if(c==="\\")esc=true;else if(c==='"')inStr=false;continue;}
    if(c==='"'){inStr=true;continue;}
    if(c==="{"){if(depth===0)start=k;depth++;}
    else if(c==="}"){depth--;if(depth===0&&start>=0){try{out.push(JSON.parse(text.slice(start,k+1)));}catch(e){}start=-1;}}
  }
  return out;
}
/* tableau complet d'une clé dans un JSON en cours d'arrivée */
function aiArr(text,key){
  text=aiClean(text);
  var k=text.indexOf('"'+key+'"');if(k<0)return null;
  var i=text.indexOf("[",k);if(i<0)return null;
  var depth=0,inStr=false,esc=false;
  for(var j=i;j<text.length;j++){
    var c=text[j];
    if(inStr){if(esc)esc=false;else if(c==="\\")esc=true;else if(c==='"')inStr=false;continue;}
    if(c==='"'){inStr=true;continue;}
    if(c==="[")depth++;
    else if(c==="]"){depth--;if(depth===0){try{return JSON.parse(text.slice(i,j+1));}catch(e){return null;}}}
  }
  return null;
}
function aiLine(x){
  if(typeof x==="string")return x.trim();
  if(x&&typeof x==="object")return Object.keys(x).map(function(k){return x[k];}).join(" ").trim();
  return "";
}
function stripNum(x){return String(x).replace(/^\s*\d+\s*[.)\-:]\s*/,"");}
function aiTypeOf(q){
  var s=q.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(/\bdesserts?\b/.test(s))return "Dessert";
  if(/\bentrees?\b/.test(s))return "Entrée";
  if(/\bplats?\b/.test(s))return "Plat";
  return "";
}
function aiListPrompt(q,cat,n,seen,inspi){
  var what=cat==="Entrée"?"entrées":cat==="Dessert"?"desserts":"plats principaux";
  var base=q?"pour cette demande : « "+q+" » (un nom de plat ou des ingrédients disponibles). Pour une entrée ou un dessert, tu peux t’éloigner des ingrédients cités et proposer des classiques populaires."
            :"au hasard, de saison ("+monthName()+"), inspiration "+inspi+".";

/* ---------- recherche : 3 requêtes en parallèle ---------- */
function aiSearch(more,cats){
  var q=aiS.q.trim(),rnd=!q;
  var key=rnd?"(hasard)":q.toLowerCase();
  aiAbort(aiS.lctls);
  var my=++aiS.rl;
  var typed=rnd?"":aiTypeOf(q),plan=cats||(typed?[typed]:CATS.slice());
  function perOf(c){return rnd?({"Entrée":2,"Plat":4,"Dessert":2})[c]:(typed?10:5);}
  var inspi=CUISINES[Math.floor(Math.random()*CUISINES.length)];
  var prev=aiS.items.slice(),added=[];
  var seen=(more||cats||rnd)?(aiSeen[key]||[]):[];
  if(!cats){aiS.items=[];aiS.catErr={};}else cats.forEach(function(c){delete aiS.catErr[c];});
  aiS.inDetail=false;aiS.err="";aiS.detail=null;aiS.running=plan.length;
  aiRender();

  function addItem(o,cat){
    if(!o)return;
    var nom=String(o.nom||o.name||o.titre||"").trim();if(!nom)return;
    var low=nom.toLowerCase();
    if(aiS.items.some(function(x){return x.cat===cat&&x.nom.toLowerCase()===low;}))return;
    aiS.items.push({nom:nom,cat:cat,description:String(o.description||"").trim(),temps:String(o.temps||"").trim()});
    added.push(nom);
  }
  function finish(){
    if(!aiS.items.length&&more&&prev.length){aiS.items=prev;aiS.catErr={};toast("Impossible de générer d’autres recettes");}
    else if(aiS.items.length&&!rnd)aiListCache[key]=aiS.items.slice();
    aiSeen[key]=seen.concat(added);
    aiRenderResults();aiRenderFoot();
  }
  plan.forEach(function(cat){
    var shown=0,tried=0;
    function once(){
      tried++;
      return aiStream(aiListPrompt(q,cat,perOf(cat),seen,inspi),function(txt){
        if(my!==aiS.rl)return;
        var objs=aiObjs(txt);
        for(;shown<objs.length;shown++)addItem(objs[shown],cat);
        aiResultsSoon();
      },aiS.lctls).then(function(txt){
        if(my!==aiS.rl)return;
        var objs=aiObjs(txt);
        for(;shown<objs.length;shown++)addItem(objs[shown],cat);
        if(!shown)throw new Error("Réponse illisible");
      }).catch(function(e){
        if(my!==aiS.rl)return;
        if(!shown&&tried<2)return once();
        throw e;
      });
    }
    once().catch(function(e){
      if(my!==aiS.rl)return;
      aiS.catErr[cat]=e.message||"Erreur";
    }).then(function(){
      if(my!==aiS.rl)return;
      aiS.running--;
      if(aiS.running<=0){aiS.running=0;finish();}else aiResultsSoon();
    });
  });
}

function aiDetail(name,cat){
  aiAbort(aiS.dctls);
  var my=++aiS.rd;aiS.dName=name;aiS.dCat=cat||"";aiS.err="";
  var dk=name+"|"+applianceLabels().join("+");
  if(aiDetailCache[dk]){aiS.detail=aiDetailCache[dk];aiS.dLoading=false;aiRender();return;}
  aiS.dLoading=true;aiS.detail=null;aiRender();
  var prompt="Donne la recette « "+name+" » pour 4 personnes."+profileText()+" Réponds UNIQUEMENT avec un objet JSON, sans texte autour ni markdown, dans cet ordre : "+
    '{"personnes":4,"ingredients":["400 g de pâtes","3 tomates","1 oignon"],"etapes":["Première étape","Deuxième étape"]}. '+
    "Chaque ingrédient sur une chaîne, la quantité d’abord puis l’ingrédient, avec les unités g, kg, ml, cl ou l. Étapes courtes (une phrase), 8 au maximum.";
  function build(txt){
    var ing=aiArr(txt,"ingredients");if(!ing||!ing.length)return null;
    var st=aiArr(txt,"etapes"),pm=/"personnes"\s*:\s*"?(\d+)/.exec(txt);
    return {nom:name,cat:normCat(cat,name),personnes:Math.max(1,pm?parseInt(pm[1],10):4),
      ing:ing.map(aiLine).filter(Boolean),
      steps:(st||[]).map(aiLine).map(stripNum).filter(Boolean),
      partial:!st};
  }
  var tried=0;
  function once(){
    tried++;
    return aiStream(prompt,function(txt){
      if(my!==aiS.rd)return;
      var d=build(txt);if(!d)return;
      var c=aiS.detail;
      if(!c||c.ing.length!==d.ing.length||c.steps.length!==d.steps.length||c.partial!==d.partial){
        aiS.detail=d;aiS.dLoading=false;aiRender(true);
      }
    },aiS.dctls).then(function(txt){
      if(my!==aiS.rd)return;
      var d=build(txt);if(!d)throw new Error("Recette illisible, réessaie");
      d.partial=false;aiDetailCache[dk]=d;aiS.detail=d;aiS.dLoading=false;aiRender(true);
    }).catch(function(e){
      if(my!==aiS.rd)return;
      if(!aiS.detail&&tried<2)return once();
      throw e;
    });
  }
  once().catch(function(e){
    if(my!==aiS.rd)return;
    aiS.dLoading=false;aiS.err=e.message||"Erreur";aiRender();
  });
}

function aiOpenFill(){

  aiS.fill={free:free,n:Math.min(free.length,6),status:"setup",targets:[],assigned:{},pending:[],done:0};

function aiFillSoon(){if(aiFT)return;aiFT=setTimeout(function(){aiFT=null;if(aiS.view==="fill")aiRender(true);},150);}
function aiWeekPrompt(k,names,cuisine){
  return "Propose "+k+" plats principaux complets et différents pour le quotidien, de saison ("+monthName()+"), inspiration "+cuisine+"."+profileText()+
    (names.length?" Ne propose pas : "+names.slice(-30).join(", ")+".":"")+

    '[{"nom":"Nom","ingredients":["400 g de pâtes","3 tomates"],"etapes":["Étape courte"]}]. '+
    "Chaque ingrédient sur une chaîne, la quantité d’abord puis l’ingrédient, unités g, kg, ml, cl ou l. 6 étapes courtes au maximum.";
}
function aiFillRun(){
  var f=aiS.fill;if(!f||!f.free.length){toast("Aucun créneau libre");return;}
  f.status="run";f.targets=f.free.slice(0,f.n);f.assigned={};f.pending=f.targets.slice();f.done=0;
  var my=++aiS.rf,names=[],rounds=0;
  aiRender();
  function placeMeal(o){
    var nom=String((o&&o.nom)||"").trim();
    var ing=(o&&Array.isArray(o.ingredients)?o.ingredients:[]).map(aiLine).filter(Boolean);
    if(!nom||!ing.length||!f.pending.length)return false;
    if(names.some(function(n){return n.toLowerCase()===nom.toLowerCase();}))return false;
    var steps=(o&&Array.isArray(o.etapes)?o.etapes:[]).map(aiLine).map(stripNum).filter(Boolean);
    var key=f.pending.shift();
    state.meals[key]={name:nom,ing:ing.join("\n"),steps:steps.map(function(x,i){return (i+1)+". "+x;}).join("\n"),base:4,people:state.people||2};
    f.assigned[key]=nom;names.push(nom);f.done++;save();
    return true;
  }
  function finish(){f.status="done";if(aiS.view==="fill")aiRender(true);if(tab==="week"||tab==="home")render();}
  function runRound(){
    if(!f.pending.length){finish();return;}
    var left=f.pending.length,chunks=[];
    for(var i=0;i<left;i+=3)chunks.push(Math.min(3,left-i));
    var running=chunks.length;
    chunks.forEach(function(k,ci){
      var got=0,shown=0;
      function take(txt){var objs=aiObjs(txt);for(;shown<objs.length;shown++){if(got<k&&placeMeal(objs[shown]))got++;}}
      aiStream(aiWeekPrompt(k,names,CUISINES[(rounds*3+ci+Math.floor(Math.random()*CUISINES.length))%CUISINES.length]),function(txt){
        if(my!==aiS.rf)return;take(txt);aiFillSoon();
      },aiS.fctls).then(function(txt){
        if(my!==aiS.rf)return;take(txt);
      }).catch(function(){}).then(function(){
        if(my!==aiS.rf)return;
        running--;
        if(running===0){rounds++;if(f.pending.length&&rounds<2)runRound();else finish();}
      });
    });
  }
  runRound();
}

    var f=aiS.fill;
    if(f&&f.status==="setup"){btn("Fermer","",aiClose);btn("Composer","main",aiFillRun);}
    else if(f&&f.status==="run"){btn("Arrêter","",aiClose);}
    else{btn("Fermer","",aiClose);btn("Voir ma semaine","main",function(){aiClose();go("week");});}
  }else if(aiS.inDetail){
    btn("‹ Retour","",aiBack);
    var d=aiS.detail;
    if(d&&!d.partial&&!aiS.dLoading&&!aiS.err){
      if(aiS.ctx==="sheet"&&v!=="fav")btn("Utiliser cette recette","main",aiUse);
      else if(aiS.ctx==="sheet")btn("Utiliser cette recette","main",aiUse);
      else btn("Ajouter à ma semaine","main",function(){if(aiDaySel&&aiSlotSel)aiAddToMenu(+aiDaySel.value,aiSlotSel.value);});
    }
  }else if(v==="fav"){
    btn("‹ Retour","",function(){aiS.view="search";aiRender();});btn("Fermer","",aiClose);
  }else{
    btn("Fermer","",aiClose);
    if(aiS.items.length&&aiS.running===0)btn("↻ Générer d’autres","main",function(){aiSearch(true);});
  }
  aiFoot.hidden=!aiFoot.children.length;
}

function aiRenderMeal(){
  var m=state.meals[aiS.mealKey];
  if(!m){aiClose();return;}
  aiPanel.appendChild(el("h3","",m.name||"Repas"));
  var f=(m.people&&m.base)?m.people/m.base:1;
  var tags=el("div","tags");
  tags.appendChild(el("span","tag",keyTitle(aiS.mealKey)));
  if(m.people)tags.appendChild(el("span","tag",m.people+" personne"+(m.people>1?"s":"")));
  if(m.leftover)tags.appendChild(el("span","tag","♻️ Reste · hors courses"));
  aiPanel.appendChild(tags);
  if(m.name){
    var fv=el("button","btn",isFav(m.name)?"★ Retirer des favoris":"☆ Ajouter aux favoris");
    fv.type="button";fv.style.width="100%";fv.style.marginBottom="10px";
    fv.addEventListener("click",function(){
      var ing=(m.ing||"").split("\n").map(function(l){return l.trim();}).filter(Boolean);
      var steps=(m.steps||"").split("\n").map(function(l){return l.trim();}).filter(Boolean);
      toggleFav({nom:m.name,cat:catOfName(m.name),personnes:m.people||state.people||2,ing:ing,steps:steps});
      aiRender();
      toast(isFav(m.name)?"Ajouté aux favoris":"Retiré des favoris");
    });
    aiPanel.appendChild(fv);
  }
  var ings=(m.ing||"").split("\n").filter(function(l){return l.trim();});
  if(ings.length){
    aiPanel.appendChild(el("h2","aisle","Ingrédients"+(m.leftover?" (non comptés dans les courses)":"")));
    ings.forEach(function(l){aiPanel.appendChild(el("div","ingl",scaledLine(l,f)));});
  }else if(m.leftover){
    aiPanel.appendChild(el("p","hint","Aucun ingrédient · c’est un reste."));
  }
  aiPanel.appendChild(el("h2","aisle","Étapes"));
  var st=(m.steps||"").split("\n").filter(function(l){return l.trim();});
  if(st.length)st.forEach(function(l){aiPanel.appendChild(el("p","stepl",l.trim()));});
  else aiPanel.appendChild(el("p","hint","Pas d’étapes enregistrées pour ce repas."));
}


function aiRenderDetail(){
  if(aiS.dLoading){aiPanel.appendChild(el("p","note","Je prépare la recette « "+aiS.dName+" »…"));return;}
  if(aiS.err||!aiS.detail){
    aiPanel.appendChild(el("p","note","Impossible : "+(aiS.err||"recette introuvable")));
    var rt=el("button","btn main","Réessayer");rt.type="button";rt.style.width="100%";
    rt.addEventListener("click",function(){aiDetail(aiS.dName,aiS.dCat);});aiPanel.appendChild(rt);
    return;
  }
  var d=aiS.detail;
  aiPanel.appendChild(el("h3","",d.nom));
  var tags=el("div","tags");
  tags.appendChild(el("span","tag",d.cat||"Plat"));
  tags.appendChild(el("span","tag",d.personnes+" portion"+(d.personnes>1?"s":"")));
  tags.appendChild(el("span","tag","✨ IA"));
  aiPanel.appendChild(tags);
  if(!d.partial){
    var fv=el("button","btn",isFav(d.nom)?"★ Retirer de mes recettes":"☆ Ajouter à mes recettes");fv.type="button";fv.style.width="100%";
    fv.addEventListener("click",function(){toggleFav(d);});aiPanel.appendChild(fv);
  }
  aiDaySel=aiSlotSel=null;
  if(!d.partial&&aiS.ctx==="ideas"){
    aiPanel.appendChild(el("h2","aisle","Quand la cuisiner ?"));
    var fr=nextFree({}),row=el("div","assign");
    aiDaySel=sel("",DAYS.map(function(x,i){return [i,x];}),fr.day,"Jour",function(){});
    aiSlotSel=sel("",SLOTS,fr.slot,"Repas",function(){});
    row.appendChild(aiDaySel);row.appendChild(aiSlotSel);aiPanel.appendChild(row);
  }
  aiPanel.appendChild(el("h2","aisle","Ingrédients"));
  d.ing.forEach(function(x){aiPanel.appendChild(el("div","ingl",x));});
  aiPanel.appendChild(el("h2","aisle","Étapes"));
  if(d.partial&&!d.steps.length)aiPanel.appendChild(el("p","hint","Rédaction des étapes…"));
  else{var ol=el("ol","steps");d.steps.forEach(function(x){ol.appendChild(el("li","",x));});aiPanel.appendChild(ol);}
}

function aiRenderFav(){
  aiPanel.appendChild(el("h3","","Mes recettes"));
  if(!state.favs.length){aiPanel.appendChild(el("p","note","Aucune recette enregistrée pour l’instant. Ouvre une recette et touche « Ajouter à mes recettes »."));return;}
  aiGrouped(aiPanel,state.favs,function(r){aiS.inDetail=true;aiS.err="";aiS.dLoading=false;aiS.detail=r;aiRender();});
}

function aiRenderSearch(){
  aiPanel.appendChild(el("h3","","Recettes AI Hub"));
  var lab=el("label","","Plat ou ingrédients");lab.htmlFor="ai-q";lab.style.marginTop="0";
  var inp=document.createElement("input");inp.type="text";inp.id="ai-q";inp.value=aiS.q;inp.placeholder="Laisse vide pour une surprise";inp.autocomplete="off";
  inp.addEventListener("input",function(){aiS.q=inp.value;});
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();aiSearch(false);}});
  aiPanel.appendChild(lab);aiPanel.appendChild(inp);
  var bar=el("div","bar");bar.style.marginTop="10px";
  var go1=el("button","btn main","Chercher");go1.type="button";go1.addEventListener("click",function(){aiSearch(false);});
  var fv=el("button","btn","★ Mes recettes ("+state.favs.length+")");fv.type="button";fv.addEventListener("click",function(){aiS.view="fav";aiRender();});
  bar.appendChild(go1);bar.appendChild(fv);aiPanel.appendChild(bar);
  var pf=el("button","chip","⚙️ Préférences : "+(profileText()?"actives":"aucune"));pf.type="button";
  pf.addEventListener("click",function(){openProfileSheet("search");});
  aiPanel.appendChild(pf);
  var box=el("div","");box.id="ai-results";aiPanel.appendChild(box);
  aiRenderResults();
}
function aiRenderResults(){
  var box=document.getElementById("ai-results");if(!box)return;
  box.replaceChildren();
  var busy=aiS.running>0,bad=Object.keys(aiS.catErr);
  if(!aiS.items.length){
    if(busy)box.appendChild(el("p","note","L’IA cherche des recettes…"));
    else if(bad.length){
      box.appendChild(el("p","note","Impossible : "+aiS.catErr[bad[0]]));
      var rt=el("button","btn main","Réessayer");rt.type="button";rt.style.width="100%";
      rt.addEventListener("click",function(){aiSearch(false);});box.appendChild(rt);
    }
    return;
  }
  aiGrouped(box,aiS.items,function(r){aiS.inDetail=true;aiDetail(r.nom,r.cat);});
  if(busy)box.appendChild(el("p","hint","D’autres recettes arrivent…"));
  else if(bad.length){
    box.appendChild(el("p","note","Impossible de charger : "+bad.map(function(c){return CATPL[c];}).join(", ")));
    var rb=el("button","btn","Réessayer");rb.type="button";rb.style.width="100%";
    rb.addEventListener("click",function(){aiSearch(false,bad);});box.appendChild(rb);
  }
}

function aiRenderFill(){
  var f=aiS.fill;
  aiPanel.appendChild(el("h3","","Composer ma semaine"));
  if(f.status==="setup"){
    aiPanel.appendChild(el("p","hint",f.free.length+" créneau"+(f.free.length>1?"x":"")+" libre"+(f.free.length>1?"s":"")+" (midi et soir). Les repas déjà prévus ne sont pas touchés."));
    aiPanel.appendChild(el("label","","Combien de repas générer ?"));
    var opts=[];for(var i=1;i<=Math.min(f.free.length,14);i++)opts.push([i,i+" repas"]);
    aiPanel.appendChild(sel("",opts,f.n,"Nombre de repas",function(v){f.n=+v;}));
    aiPanel.appendChild(el("p","hint",profileText()?"Tes préférences (matériel, envies, aliments à éviter) sont prises en compte.":"Astuce : renseigne ton profil gourmand pour des recettes sur mesure."));
    var pf=el("button","chip","⚙️ Mon profil gourmand");pf.type="button";pf.style.marginTop="10px";
    pf.addEventListener("click",function(){openProfileSheet("fill");});aiPanel.appendChild(pf);
    return;
  }
  aiPanel.appendChild(el("p","hint",f.status==="done"
    ?f.done+" repas ajouté"+(f.done>1?"s":"")+(f.done<f.targets.length?" sur "+f.targets.length:"")+" à ta semaine."
    :"Génération en cours… "+f.done+"/"+f.targets.length));
  f.targets.forEach(function(k){
    var row=el("div","ingl");row.style.display="flex";row.style.justifyContent="space-between";row.style.gap="12px";
    var l=el("span","",keyTitle(k));l.style.color="var(--mute)";row.appendChild(l);
    var nm=f.assigned[k];
    var s=el("b","",nm||(f.status==="done"?"— non généré":"…"));s.style.textAlign="right";row.appendChild(s);
    aiPanel.appendChild(row);
  });
}

function aiRenderProfile(){
  aiPanel.appendChild(el("h3","","Mon profil gourmand"));
  aiPanel.appendChild(el("p","hint","Ces préférences guident l’IA quand elle propose des recettes."));
  aiPanel.appendChild(el("h2","aisle","Apparence de cet appareil"));
  var thBox=el("div","chips");
  THEMES.forEach(function(t){
    var c=el("button","chip",t[1]);c.type="button";
    function paintAll(){Array.prototype.forEach.call(thBox.children,function(x,i){x.setAttribute("aria-pressed",String(THEMES[i][0]===getTheme()));});}
    c.addEventListener("click",function(){setTheme(t[0]);paintAll();});
    thBox.appendChild(c);
  });
  Array.prototype.forEach.call(thBox.children,function(x,i){x.setAttribute("aria-pressed",String(THEMES[i][0]===getTheme()));});
  aiPanel.appendChild(thBox);
  aiPanel.appendChild(el("h2","aisle","Personnes à table"));
  var st=el("div","stepper");
  var minus=el("button","","−");minus.type="button";minus.setAttribute("aria-label","Moins");
  var val=el("b","",String(state.people));
  var plus=el("button","","+");plus.type="button";plus.setAttribute("aria-label","Plus");
  function setP(n){state.people=Math.max(1,Math.min(12,n));val.textContent=String(state.people);save();}
  minus.addEventListener("click",function(){setP(state.people-1);});
  plus.addEventListener("click",function(){setP(state.people+1);});
  st.appendChild(minus);st.appendChild(val);st.appendChild(plus);aiPanel.appendChild(st);

  function chipSet(title,items,arr){
    aiPanel.appendChild(el("h2","aisle",title));
    var box=el("div","chips");
    items.forEach(function(it){
      var c=el("button","chip",it[1]);c.type="button";
      function paint(){c.setAttribute("aria-pressed",String(arr().indexOf(it[0])>-1));}
      paint();
      c.addEventListener("click",function(){toggleIn(arr(),it[0]);save();paint();});
      box.appendChild(c);
    });
    aiPanel.appendChild(box);
  }
  chipSet("Mon matériel",APPLIANCES.map(function(a){return [a.id,a.label];}),function(){return state.appliances;});
  chipSet("Mes envies",WISHES,function(){return state.profile.wishes;});

  aiPanel.appendChild(el("h2","aisle","Ce que j’évite"));
  var av=el("div","chips");av.style.marginBottom="10px";
  function drawAvoid(){
    av.replaceChildren();
    state.profile.avoid.forEach(function(t,i){
      var c=el("button","chip",t);c.type="button";c.appendChild(el("span","x","×"));
      c.addEventListener("click",function(){state.profile.avoid.splice(i,1);save();drawAvoid();});
      av.appendChild(c);
    });
    av.hidden=!state.profile.avoid.length;
  }
  drawAvoid();aiPanel.appendChild(av);
  var row=el("div","addrow");
  var inp=document.createElement("input");inp.type="text";inp.placeholder="Ex. : coriandre, abats";inp.autocomplete="off";
  var add=el("button","btn main","+");add.type="button";add.setAttribute("aria-label","Ajouter");
  function addAvoid(){
    inp.value.split(/[,;]+/).forEach(function(x){x=x.trim();if(x&&state.profile.avoid.indexOf(x)<0&&state.profile.avoid.length<20)state.profile.avoid.push(x);});
    inp.value="";save();drawAvoid();
  }
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addAvoid();}});
  add.addEventListener("click",addAvoid);
  row.appendChild(inp);row.appendChild(add);aiPanel.appendChild(row);
}

function aiRenderSync(){
  aiPanel.appendChild(el("h3","","Synchronisation"));
  if(familyCode){
    aiPanel.appendChild(el("p","hint","Les téléphones connectés partagent le même menu."));
    aiPanel.appendChild(el("p","","Code famille :"));
    var codeBox=el("div","");
    codeBox.style.cssText="font:800 30px 'Plus Jakarta Sans',sans-serif;letter-spacing:5px;text-align:center;padding:16px;background:var(--bg);border-radius:16px;margin:8px 0 16px";
    codeBox.textContent=familyCode;
    aiPanel.appendChild(codeBox);
    var copyBtn=el("button","btn main","Copier le code");copyBtn.type="button";copyBtn.style.width="100%";
    copyBtn.addEventListener("click",function(){
      navigator.clipboard.writeText(familyCode).then(function(){toast("Code copié");}).catch(function(){toast("Copie impossible");});
    });
    aiPanel.appendChild(copyBtn);
    var leaveBtn=el("button","btn warn","Quitter ce partage");leaveBtn.type="button";leaveBtn.style.width="100%";leaveBtn.style.marginTop="10px";
    leaveBtn.addEventListener("click",function(){
      if(confirm("Arrêter la synchronisation sur cet appareil ?")){leaveFamily();aiClose();}
    });
    aiPanel.appendChild(leaveBtn);
  }else{
    aiPanel.appendChild(el("p","hint","Crée un code pour partager le menu avec un autre téléphone, ou rejoins un code existant."));
    var createBtn=el("button","btn main","Créer un nouveau code famille");createBtn.type="button";createBtn.style.width="100%";createBtn.style.margin="12px 0 16px";
    createBtn.addEventListener("click",function(){
      var code=generateFamilyCode();
      startSync(code);
      setTimeout(function(){if(aiS.view==="sync")aiRender();},300);
      setTimeout(function(){if(aiS.view==="sync")aiRender();},1900);
    });
    aiPanel.appendChild(createBtn);
    aiPanel.appendChild(el("label","","Rejoindre avec un code"));
    var inp=document.createElement("input");inp.type="text";inp.id="sync-code";inp.placeholder="Ex. : A7K9P2";inp.style.textTransform="uppercase";inp.maxLength=6;
    aiPanel.appendChild(inp);
    var joinBtn=el("button","btn main","Rejoindre");joinBtn.type="button";joinBtn.style.width="100%";joinBtn.style.marginTop="10px";
    joinBtn.addEventListener("click",function(){
      var code=(inp.value||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
      if(code.length<4){toast("Code trop court");return;}
      startSync(code);toast("Connexion au code "+code+"…");aiClose();render();
    });
    aiPanel.appendChild(joinBtn);
  }
}

document.getElementById("f-ai").addEventListener("click",function(){
  aiOpen("sheet",document.getElementById("f-name").value.trim());
});

/* --- Web Share Target --- */
function checkSharedTarget(){
  var params=new URLSearchParams(window.location.search);
  if(params.get("share")==="true"){
    var sharedUrl=params.get("url")||params.get("text")||"";
    var match=sharedUrl.match(/https?:\/\/[^\s]+/);
    if(match)sharedUrl=match[0];
    if(sharedUrl&&sharedUrl.includes("marmiton.org")){
      go("week");
      setTimeout(function(){
        openSheet("0-m","Lundi, midi");
        document.getElementById("f-url").value=sharedUrl;
        document.getElementById("f-import").click();
      },100);
    }
  }
}

if("serviceWorker" in navigator){
  var sw="self.addEventListener('install',e=>{self.skipWaiting()});self.addEventListener('activate',e=>{e.waitUntil(clients.claim())});self.addEventListener('fetch',e=>{e.respondWith(caches.open('menu-v2').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(e.request.method==='GET'&&res.ok)c.put(e.request,res.clone());return res}).catch(()=>caches.match('./'))))})";
  var blob=new Blob([sw],{type:"text/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(){});
}

route();
