<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F7D4F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Menu de la semaine</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF2F7;--surface:#fff;--ink:#17212B;--mute:#5B6773;--line:#D5DDE6;--acc:#2F7D4F;--accink:#fff;--warn:#C4402B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111A22;--surface:#1A2530;--ink:#EAF0F5;--mute:#9AA8B5;--line:#2C3A47;--acc:#5BBF86;--accink:#0E1A13;--warn:#F07A66}}
:root[data-theme="dark"]{--bg:#111A22;--surface:#1A2530;--ink:#EAF0F5;--mute:#9AA8B5;--line:#2C3A47;--acc:#5BBF86;--accink:#0E1A13;--warn:#F07A66}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin-inline:auto;padding:16px 16px 96px}
h1{font-size:28px;font-weight:800;margin:8px 0 14px;letter-spacing:-.02em}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:600 15px inherit;font-family:inherit;padding:10px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--accink)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.day.today{border-color:var(--acc);border-width:2px}
.day h2{font-size:17px;font-weight:800;margin:0;padding:12px 14px 6px}
.slot{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-family:inherit;padding:12px 14px;cursor:pointer;transition:background .15s}
.slot:active{background:var(--bg)}
.slot .when{flex:0 0 52px;color:var(--mute);font-size:14px}
.slot .what{flex:1}
.slot .what.empty{color:var(--mute)}
.slot small{display:block;color:var(--mute);font-size:13px}
.slot:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:opacity .15s}
.row input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.row.done span{text-decoration:line-through;color:var(--mute)}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.btn{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px inherit;font-family:inherit;padding:12px;border-radius:12px;cursor:pointer;min-width:0;transition:transform .1s,background .15s}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.warn{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.aisle{font-size:15px;font-weight:800;color:var(--mute);margin:16px 2px 8px}
[hidden]{display:none!important}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;transition:border-color .2s,border-width .2s}
.idea.on{border-color:var(--acc);border-width:2px}
.ichk{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.ichk input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin-top:2px}
.ichk small{display:block;color:var(--mute);font-size:13px}
.preview{font-size:13px;color:var(--mute);margin:8px 0 0 34px;line-height:1.35}
.assign{display:flex;gap:8px;margin-top:10px}
.assign select{flex:1;min-width:0;font:inherit;font-size:16px;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.addbar{position:sticky;bottom:12px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.addbar .btn{width:100%;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.back{border:0;background:none;color:var(--acc);font:600 17px inherit;font-family:inherit;padding:8px 0;cursor:pointer}
.tile{display:flex;align-items:center;gap:18px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:22px 20px;margin-bottom:14px;font:inherit;font-family:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tile:active{transform:scale(.985)}
.tile .ico{flex:none;width:76px;height:76px;border-radius:20px;background:var(--acc);color:var(--accink);display:grid;place-items:center}
.tile .ico svg{width:44px;height:44px}
.tile .tt{font-size:24px;font-weight:800;letter-spacing:-.01em}
.tile .tt small{display:block;font-size:14px;font-weight:400;color:var(--mute);margin-top:2px}
.tile:focus-visible,.back:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.note{color:var(--mute);padding:24px 8px;text-align:center}
#sheet,#aisheet{position:fixed;inset:0;background:rgba(10,16,22,0);display:flex;align-items:flex-end;z-index:20;pointer-events:none;transition:background .25s}
#sheet.open,#aisheet.open{background:rgba(10,16,22,.55);pointer-events:auto}
#aisheet{z-index:25}
#sheet form,#sheet .panel,#aisheet .panel{width:100%;max-width:560px;margin-inline:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.open form,#sheet.open .panel,#aisheet.open .panel{transform:translateY(0)}
#aisheet .panel{max-height:92vh;min-height:60vh;overflow:auto}
#sheet h3,#aisheet h3{margin:0 0 12px;font-size:20px;font-weight:800}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;font-size:16px;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:130px;resize:vertical}
.hint{color:var(--mute);font-size:13px;margin:4px 0 0}
.acts{display:flex;gap:8px;margin-top:14px}
.sug{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:30vh;overflow:auto}
.sug .btn{text-align:left;font-weight:400}
#sheet form{max-height:92vh;overflow:auto}
.rec{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--ink);font:inherit;font-family:inherit;cursor:pointer}
.rec:active{transform:scale(.99)}
.rec strong{display:block;font-weight:800}
.rec small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.ingl{padding:8px 0;border-top:1px solid var(--line)}
.steps{margin:0 0 8px;padding-left:22px}
.steps li{margin-bottom:10px}
.slotwrap{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.slotwrap .slot{border-top:0;width:auto;flex:1;min-width:0}
.recbtn{flex:none;border:0;border-left:1px solid var(--line);background:none;color:var(--acc);font-weight:600;font-size:14px;font-family:inherit;padding:0 14px;cursor:pointer}
.stepl{margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.stats{display:flex;gap:10px;margin-bottom:18px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat strong{display:block;font-size:22px;font-weight:800}
.stat span{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<header id="top"></header>
<main id="view"></main>

<div id="sheet" aria-hidden="true">
  <form id="form">
    <h3 id="sh-title"></h3>
    <label for="f-name">Repas</label>
    <input type="text" id="f-name" placeholder="Ex. : pâtes à la tomate" autocomplete="off">
    <div class="bar" style="margin:8px 0 0"><button type="button" class="btn" id="f-search">Chercher sur Marmiton</button><button type="button" class="btn main" id="f-ai">Chercher sur AI Hub</button></div>

    <label for="f-url">Lien d’une recette</label>
    <div style="display:flex; gap:8px; margin-bottom: 8px;">
      <input type="text" id="f-url" inputmode="url" placeholder="https://www.marmiton.org/…" autocomplete="off" style="flex:1;">
      <button type="button" class="btn main" id="f-paste" style="flex:0 0 auto; padding:10px 16px; font-weight:800;">Coller</button>
    </div>

    <div class="bar" style="margin:8px 0 0"><button type="button" class="btn" id="f-import">Importer les ingrédients</button></div>
    <label for="f-ing">Ingrédients (un par ligne)</label>
    <textarea id="f-ing" placeholder="400 g de pâtes&#10;3 tomates&#10;1 oignon"></textarea>
    <label for="f-steps">Étapes (facultatif)</label>
    <textarea id="f-steps" style="min-height:90px" placeholder="1. Faire cuire les pâtes…"></textarea>
    <div class="bar" style="margin:12px 0 0">
      <div style="flex:1"><label for="f-base" style="margin-top:0">Recette pour</label><input type="number" id="f-base" min="1" max="99" inputmode="numeric"></div>
      <div style="flex:1"><label for="f-ppl" style="margin-top:0">Je cuisine pour</label><input type="number" id="f-ppl" min="1" max="99" inputmode="numeric"></div>
    </div>
    <p class="hint">Quantité d’abord, puis l’ingrédient. Les doublons s’additionnent dans la liste de courses.</p>
    <div class="acts">
      <button type="button" class="btn warn" id="f-clear">Vider</button>
      <button type="button" class="btn" id="f-cancel">Fermer</button>
      <button type="submit" class="btn main">Enregistrer</button>
    </div>
  </form>
</div>
<div id="aisheet" aria-hidden="true"><div class="panel" id="ai-panel"></div></div>
<div id="toast" role="status"></div>

<script>
/* Menu de la semaine – v3 */
var DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
var KEY="menu-semaine-v1";
var DKEY="menu-draft";

var state={meals:{},checked:{},people:2,favs:[]};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.meals)state=p;if(!state.checked)state.checked={};if(!state.people)state.people=2;if(!state.favs)state.favs=[];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

var tab="home",editKey=null;
var view=document.getElementById("view");
var today=(new Date().getDay()+6)%7;

function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}

function ingCount(m){return m&&m.ing?m.ing.split("\n").filter(function(l){return l.trim();}).length:0;}

function renderWeek(){
  view.replaceChildren();
  DAYS.forEach(function(d,i){
    var card=el("section","day"+(i===today?" today":""));
    card.appendChild(el("h2","",d+(i===today?" (aujourd’hui)":"")));
    [["p","Matin"],["m","Midi"],["s","Soir"]].forEach(function(s){
      var key=i+"-"+s[0],m=state.meals[key];
      var b=el("button","slot");b.type="button";
      b.appendChild(el("span","when",s[1]));
      var w=el("span","what"+(m&&m.name?"":" empty"),m&&m.name?m.name:"Ajouter un repas");
      if(m&&m.name&&ingCount(m)){w.appendChild(el("small","",ingCount(m)+" ingrédient"+(ingCount(m)>1?"s":"")+(m.people?", "+m.people+" pers.":"")));}
      b.appendChild(w);
      b.addEventListener("click",function(){openSheet(key,d+", "+s[1].toLowerCase());});
      var wrap=el("div","slotwrap");wrap.appendChild(b);
      if(m&&m.name&&(ingCount(m)||(m.steps&&m.steps.trim()))){
        var rb=el("button","recbtn","Recette");rb.type="button";
        rb.addEventListener("click",function(){aiOpenMeal(key);});
        wrap.appendChild(rb);
      }
      card.appendChild(wrap);
    });
    view.appendChild(card);
  });
}

var RX=/^(\d+(?:[.,]\d+)?|\d\/\d|[½¼¾])\s*(kg|g|l|ml|cl)?\s+(?:de\s+|d’|d')?(.+)$/i;
function toNum(x){var F={"½":.5,"¼":.25,"¾":.75};if(F[x])return F[x];if(x.indexOf("/")>0){var a=x.split("/");return (+a[0])/(+a[1]||1);}return parseFloat(String(x).replace(",","."))||0;}

function buildList(){
  var map={};
  Object.keys(state.meals).forEach(function(k){
    var m=state.meals[k];if(!m||!m.ing)return;var f=(m.people&&m.base)?m.people/m.base:1;
    m.ing.split("\n").forEach(function(line){
      line=line.trim();if(!line)return;
      var q=null,u="",n=line,r=RX.exec(line);
      if(r){q=toNum(r[1]);u=(r[2]||"").toLowerCase();n=r[3].trim();}
      if(u==="kg"){q*=1000;u="g";}else if(u==="l"){q*=1000;u="ml";}else if(u==="cl"){q*=10;u="ml";}
      var id=n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")+"|"+u;
      if(!map[id])map[id]={id:id,name:n,unit:u,qty:0};
      if(q!=null)map[id].qty+=q*f;
    });
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return a.name.localeCompare(b.name,"fr");});
}
function fmt(it){
  var q=it.qty,u=it.unit;if(!q)return it.name;if(!u)q=Math.ceil(q-1e-9);
  if(u==="g"&&q>=1000){q=q/1000;u="kg";}
  if(u==="ml"&&q>=1000){q=q/1000;u="l";}
  q=Math.round(q*100)/100;
  var s=String(q).replace(".",",");
  return s+(u?" "+u:"")+" "+it.name;
}

var AISLES=["Fruits et légumes","Viandes et poissons","Produits frais","Épicerie","Boulangerie","Boissons","Autres"];
var KW=[
  "tomate carotte oignon ail echalote courgette aubergine poivron patate pomme de terre champignon salade laitue epinard concombre poireau chou brocoli haricot citron orange pomme banane fraise framboise myrtille cerise raisin poire peche abricot prune kiwi ananas mangue melon pasteque avocat celeri navet radis betterave potiron courge mais persil basilic coriandre ciboulette thym menthe romarin gingembre curcuma fruit legume herbe asperge artichaut fenouil endive mâche roquette cresson petit pois",
  "poulet dinde boeuf bœuf veau porc agneau jambon lardon saucisse steak viande saumon thon cabillaud poisson crevette moule merlu canard dinde volaille bacon merguez chorizo saumon truite sardine maquereau bar sole cabillaud colin crevette gambas calamar seiche moule huitre coquille saint jacques",
  "lait creme fromage beurre yaourt oeuf œuf mozzarella parmesan gruyere emmental feta ricotta mascarpone creme fraiche fromage blanc skyr kefir beurre margarine",
  "pates riz farine sucre sel poivre huile vinaigre sauce conserve lentille chiche semoule quinoa epice moutarde bouillon chocolat miel levure cafe the cacao cornichon olive capre ketchup mayonnaise harissa curry paprika cumin curcuma cannelle vanille levure chimique bicarbonate flocons d avoine cereale muesli confiture compote",
  "pain baguette brioche croissant pain de mie biscotte toast",
  "eau jus soda biere vin lait vegetal limonade sirop"
];
function aisle(n){
  var tk=n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/[^a-z0-9]+/);
  for(var i=0;i<KW.length;i++){
    var ws=KW[i].split(" ");
    for(var j=0;j<ws.length;j++){
      var w=ws[j];
      if(tk.some(function(t){return t===w||t===w+"s"||t===w+"x"||t.startsWith(w)&&t.length<=w.length+2;}))return AISLES[i];
    }
  }
  return AISLES[6];
}

function renderList(){
  view.replaceChildren();
  var items=buildList();
  if(!items.length){view.appendChild(el("p","note","Ajoute des ingrédients à tes repas : la liste se remplit toute seule."));return;}
  var bar=el("div","bar");
  var c=el("button","btn main","Copier la liste");c.type="button";
  var all=el("button","btn","Tout cocher");all.type="button";
  var r=el("button","btn","Tout décocher");r.type="button";
  c.addEventListener("click",copyList);
  all.addEventListener("click",function(){items.forEach(function(it){state.checked[it.id]=1;});save();renderList();});
  r.addEventListener("click",function(){state.checked={};save();renderList();});
  bar.appendChild(c);bar.appendChild(all);bar.appendChild(r);view.appendChild(bar);

  var last="";
  items.sort(function(a,b){var x=aisle(a.name),y=aisle(b.name);return x!==y?AISLES.indexOf(x)-AISLES.indexOf(y):a.name.localeCompare(b.name,"fr");});
  items.forEach(function(it){
    var ay=aisle(it.name);if(ay!==last){view.appendChild(el("h2","aisle",ay));last=ay;}
    var row=el("label","row"+(state.checked[it.id]?" done":""));
    var cb=document.createElement("input");cb.type="checkbox";cb.checked=!!state.checked[it.id];
    cb.addEventListener("change",function(){if(cb.checked)state.checked[it.id]=1;else delete state.checked[it.id];save();row.classList.toggle("done",cb.checked);});
    row.appendChild(cb);row.appendChild(el("span","",fmt(it)));
    view.appendChild(row);
  });
}
function copyList(){
  var txt=buildList().filter(function(it){return !state.checked[it.id];}).map(function(it){return "- "+fmt(it);}).join("\n");
  var done=function(ok){toast(ok?"Liste copiée":"Copie impossible");};
  try{navigator.clipboard.writeText(txt).then(function(){done(true);},function(){done(false);});}catch(e){done(false);}
}

var tt;function toast(t){
  var n=document.getElementById("toast");
  n.textContent=t;n.classList.add("show");
  clearTimeout(tt);tt=setTimeout(function(){n.classList.remove("show");},2000);
}

var sheet=document.getElementById("sheet");
function openSheet(key,title){
  editKey=key;var m=state.meals[key]||{name:"",ing:""};
  document.getElementById("sh-title").textContent=title;
  document.getElementById("f-name").value=m.name||"";
  document.getElementById("f-ing").value=m.ing||"";
  document.getElementById("f-steps").value=m.steps||"";
  document.getElementById("f-url").value="";
  var pp=m.people||state.people||2;
  document.getElementById("f-ppl").value=pp;
  document.getElementById("f-base").value=m.base||pp;
  sheet.classList.add("open");sheet.setAttribute("aria-hidden","false");
  setTimeout(function(){document.getElementById("f-name").focus();},50);
}
function closeSheet(){
  sheet.classList.remove("open");sheet.setAttribute("aria-hidden","true");
  try{localStorage.removeItem(DKEY);}catch(e){}
  editKey=null;
}
document.getElementById("form").addEventListener("submit",function(e){
  e.preventDefault();
  var name=document.getElementById("f-name").value.trim(),ing=document.getElementById("f-ing").value,steps=document.getElementById("f-steps").value;
  var ppl=Math.max(1,parseInt(document.getElementById("f-ppl").value,10)||2),base=Math.max(1,parseInt(document.getElementById("f-base").value,10)||ppl);
  state.people=ppl;
  if(name||ing.trim())state.meals[editKey]={name:name,ing:ing,steps:steps,base:base,people:ppl};else delete state.meals[editKey];
  save();closeSheet();render();
});
document.getElementById("f-cancel").addEventListener("click",closeSheet);
document.getElementById("f-clear").addEventListener("click",function(){
  if(!state.meals[editKey]){closeSheet();return;}
  if(confirm("Vider ce repas ?")){delete state.meals[editKey];save();closeSheet();render();}
});
/* La fenêtre ne se ferme plus en touchant la zone grisée : seulement via Fermer / Enregistrer */

function decode(t){var n=document.createElement("textarea");n.innerHTML=t;return n.value;}
document.getElementById("f-search").addEventListener("click",function(){
  var q=document.getElementById("f-name").value.trim();
  if(!q){toast("Saisis d’abord le nom du repas");return;}
  window.open("https://www.marmiton.org/recettes/recherche.aspx?aqt="+encodeURIComponent(q),"_blank","noopener");
});

var MEALDB="https://www.themealdb.com/api/json/v1/1/";
function trList(list,from,to){
  var chunks=[],cur=[],len=0;
  list.forEach(function(t){if(len+t.length>380&&cur.length){chunks.push(cur);cur=[];len=0;}cur.push(t);len+=t.length+1;});
  if(cur.length)chunks.push(cur);
  return Promise.all(chunks.map(function(c){
    return fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(c.join("\n"))+"&langpair="+from+"|"+to)
      .then(function(r){return r.json();})
      .then(function(d){
        var out=d&&d.responseStatus===200&&d.responseData?String(d.responseData.translatedText).split("\n"):null;
        return out&&out.length===c.length?out:c;
      }).catch(function(){return c;});
  })).then(function(parts){return [].concat.apply([],parts);});
}

var ideas={q:"",list:null,loading:false,sel:{},preview:{},all:null,off:0,t:1};

var LEVELS=["Faciles","Intermédiaires","Élaborées"];
var rawCache={};

function getMeal(id){
  if(rawCache[id])return Promise.resolve(rawCache[id]);
  return fetch(MEALDB+"lookup.php?i="+encodeURIComponent(id))
    .then(function(x){if(!x.ok)throw 0;return x.json();})
    .then(function(d){var m=(d.meals||[])[0]||null;if(m)rawCache[id]=m;return m;})
    .catch(function(){return null;});
}
function countIng(m){var n=0;for(var i=1;i<=20;i++)if((m["strIngredient"+i]||"").trim())n++;return n;}
function levelOf(n){return n<=7?0:n<=12?1:2;}

function api(p){
  return getMeal(p.id).then(function(m){
    if(!m)return {};
    var lines=[];
    for(var i=1;i<=20;i++){var g=(m["strIngredient"+i]||"").trim(),q=(m["strMeasure"+i]||"").trim();if(g)lines.push((q+" "+g).trim());}
    return trList([m.strMeal].concat(lines),"en","fr").then(function(t){return {name:t[0],ingredients:t.slice(1)};});
  });
}

function nextFree(taken){
  for(var d=0;d<7;d++){for(var j=2;j>=1;j--){
    var k=d+"-"+SLOTS[j][0];if(!state.meals[k]&&!taken[k])return {day:d,slot:SLOTS[j][0]};
  }}
  for(var d=0;d<7;d++){
    var k=d+"-p";if(!state.meals[k]&&!taken[k])return {day:d,slot:"p"};
  }
  return {day:0,slot:"s"};
}

function terms(){return ideas.q.split(/[,;\n]+/).map(function(t){return t.trim();}).filter(Boolean).slice(0,4);}

function searchIdeas(){
  var ts=terms();
  if(!ts.length){toast("Saisis au moins un ingrédient");return;}
  ideas.loading=true;ideas.list=null;ideas.sel={};ideas.preview={};ideas.all=null;ideas.off=0;ideas.t=ts.length;renderIdeas();
  trList(ts,"fr","en").then(function(en){
    return Promise.all(en.map(function(t){
      return fetch(MEALDB+"filter.php?i="+encodeURIComponent(t.toLowerCase().trim().replace(/\s+/g,"_")))
        .then(function(x){return x.json();}).then(function(d){return d.meals||[];}).catch(function(){return [];});
    }));
  }).then(function(res){
    var map={};
    res.forEach(function(ms){ms.forEach(function(m){
      if(!map[m.idMeal])map[m.idMeal]={id:m.idMeal,en:m.strMeal,hits:0};
      map[m.idMeal].hits++;
    });});
    ideas.all=Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return b.hits-a.hits;});
    ideasBatch();
  }).catch(function(){ideas.loading=false;ideas.list=[];renderIdeas();toast("Recherche impossible (réseau ou quota)");});
}

function ideasBatch(){
  var all=ideas.all||[];
  if(!all.length){ideas.list=[];ideas.loading=false;renderIdeas();return;}
  if(ideas.off>=all.length)ideas.off=0;
  var chunk=all.slice(ideas.off,ideas.off+18);ideas.off+=18;
  ideas.loading=true;ideas.list=null;ideas.sel={};ideas.preview={};renderIdeas();
  Promise.all(chunk.map(function(a){
    return getMeal(a.id).then(function(m){a.n=m?countIng(m):10;a.mc=m?m.strCategory:"";return a;}).catch(function(){a.n=10;a.mc="";return a;});
  })).then(function(arr){
    return trList(arr.map(function(a){return a.en;}),"en","fr").then(function(names){
      arr.forEach(function(a,i){a.name=names[i];a.cat=normCat(a.mc,a.name);a.t=ideas.t;});return arr;
    });
  }).then(function(arr){ideas.list=arr;ideas.loading=false;renderIdeas();window.scrollTo(0,0);})
  .catch(function(){ideas.loading=false;ideas.list=[];renderIdeas();toast("Recherche impossible (réseau ou quota)");});
}

function parseRecipe(html){
  var re=/<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/gi,m,out=null;
  while((m=re.exec(html))){try{
    var d=JSON.parse(m[1]),list=Array.isArray(d)?d:(d["@graph"]||[d]);
    list.forEach(function(x){var t=x["@type"];if(t==="Recipe"||(Array.isArray(t)&&t.indexOf("Recipe")>-1))out={name:x.name,ing:x.recipeIngredient||[],yld:x.recipeYield};});
  }catch(e){}}
  return out;
}

document.getElementById("f-paste").addEventListener("click", async function(){
  var text="";
  try{
    if(navigator.clipboard.read){
      var items=await navigator.clipboard.read();
      for(var i=0;i<items.length&&!text;i++){
        var types=["text/uri-list","text/plain"];
        for(var j=0;j<types.length;j++){
          if(items[i].types.indexOf(types[j])>-1){
            text=await (await items[i].getType(types[j])).text();
            if(text)break;
          }
        }
      }
    }
    if(!text)text=await navigator.clipboard.readText();
  }catch(err){
    try{text=await navigator.clipboard.readText();}catch(e2){}
  }
  var m=(text||"").match(/https?:\/\/[^\s]+/);

var CATS=["Entrée","Plat","Dessert"],CATPL={"Entrée":"Entrées","Plat":"Plats","Dessert":"Desserts"};
function catOfName(n){
  var s=String(n||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(/(gateau|mousse|cookie|brownie|crepe|flan|glace|sorbet|tiramisu|panna cotta|compote|clafoutis|muffin|beignet|riz au lait|charlotte|macaron|pudding|fondant|biscuit|salade de fruit|dessert|creme brulee|creme caramel|tarte (aux|au) (pomme|fraise|citron|poire|chocolat|myrtille|abricot|framboise|prune|cerise|fruit)|tarte tatin|cheesecake|pie\b|cake)/.test(s))return "Dessert";
  if(/(soupe|veloute|salade|gaspacho|houmous|tapenade|carpaccio|tartare|terrine|bruschetta|verrine|accras|rillettes|entree)/.test(s))return "Entrée";
  return "Plat";
}
function normCat(c,name){
  var s=String(c||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(s.indexOf("entr")===0||s.indexOf("starter")===0||s.indexOf("side")===0||s.indexOf("apero")===0)return "Entrée";
  if(s.indexOf("dessert")===0)return "Dessert";
  if(s.indexOf("plat")===0||s.indexOf("main")===0)return "Plat";
  return catOfName(name);
}
function keyTitle(k){
  var p=k.split("-"),sl=SLOTS.filter(function(x){return x[0]===p[1];})[0];
  return DAYS[+p[0]]+", "+(sl?sl[1].toLowerCase():"");
}
function scaledLine(line,f){
  line=line.trim();var r=RX.exec(line);if(!r||f===1)return line;
  var q=toNum(r[1])*f,u=(r[2]||"").toLowerCase(),n=r[3].trim();
  if(u==="kg"){q*=1000;u="g";}else if(u==="l"){q*=1000;u="ml";}else if(u==="cl"){q*=10;u="ml";}
  return fmt({qty:q,unit:u,name:n});
}

  if(aiS.q.trim()&&!aiS.list)aiSearch(false);
}
function aiOpenMeal(key){aiS.view="meal";aiS.mealKey=key;aiS.inDetail=false;aiShow();aiRender();}
function aiClose(){aiSheet.classList.remove("open");aiSheet.setAttribute("aria-hidden","true");aiS.req++;}

function aiSearch(more){
  var q=aiS.q.trim();
  if(!q){toast("Saisis un plat ou des ingrédients");return;}
  var key=q.toLowerCase(),my=++aiS.req,prev=aiS.list;
  var seen=more?(aiSeen[key]||[]):[];
  aiS.inDetail=false;aiS.loading=true;aiS.err="";aiS.list=null;aiS.detail=null;aiRender();
  var prompt="Propose des recettes de cuisine pour cette demande : « "+q+" » (un nom de plat ou des ingrédients disponibles). "+
    "Propose 5 entrées, 5 plats principaux et 5 desserts, tous différents. Si la demande précise déjà un type (entrée, plat ou dessert), propose seulement 12 recettes de ce type. "+
    (seen.length?"Ne propose surtout pas ces recettes déjà vues : "+seen.slice(-45).join(", ")+". ":"")+
    "Réponds UNIQUEMENT avec un tableau JSON, sans texte autour ni markdown, au format : "+
    '[{"nom":"Nom de la recette","categorie":"Plat","description":"une phrase courte","temps":"30 min"}] '+
    "(categorie vaut Entrée, Plat ou Dessert).";
  function attempt(n){
    return aiAsk(prompt).then(function(txt){
      var arr=aiJSON(txt,"[","]");
      if(Array.isArray(arr)&&arr.length)return arr;
      if(n<1)return attempt(n+1);
      throw new Error("Réponse illisible, réessaie");
    });
  }
  attempt(0).then(function(arr){
    if(my!==aiS.req)return;
    var list=arr.map(function(r){
      if(typeof r==="string")r={nom:r};
      var nom=String(r.nom||r.name||r.titre||"").trim();
      return {nom:nom,cat:normCat(r.categorie||r.category,nom),description:String(r.description||"").trim(),temps:String(r.temps||"").trim()};
    }).filter(function(r){return r.nom;}).slice(0,18);
    if(!list.length)throw new Error("Aucune recette trouvée");
    aiListCache[key]=list;aiSeen[key]=seen.concat(list.map(function(r){return r.nom;}));
    aiS.list=list;aiS.loading=false;aiRender();aiPanel.scrollTop=0;
  }).catch(function(e){
    if(my!==aiS.req)return;
    aiS.loading=false;
    if(more&&prev){aiS.list=prev;aiRender();toast("Impossible de générer d’autres recettes");return;}
    aiS.err=e.message||"Erreur";aiRender();
  });
}

function aiDetail(name,cat){
  var my=++aiS.req;aiS.dName=name;aiS.dCat=cat||"";
  if(aiDetailCache[name]){aiS.detail=aiDetailCache[name];aiS.dLoading=false;aiS.err="";aiRender();return;}
  aiS.dLoading=true;aiS.err="";aiS.detail=null;aiRender();
  var prompt="Donne la recette « "+name+" » pour 4 personnes. Réponds UNIQUEMENT avec un objet JSON, sans texte autour ni markdown, au format : "+
    '{"nom":"…","personnes":4,"ingredients":["400 g de pâtes","3 tomates","1 oignon"],"etapes":["Première étape…","Deuxième étape…"]}. '+
    "Chaque ingrédient sur une chaîne, la quantité d'abord puis l'ingrédient, avec les unités g, kg, ml, cl ou l.";
  function attempt(n){
    return aiAsk(prompt).then(function(txt){
      var o=aiJSON(txt,"{","}");
      if(o&&Array.isArray(o.ingredients)&&o.ingredients.length)return o;
      if(n<1)return attempt(n+1);
      throw new Error("Recette illisible, réessaie");
    });
  }
  attempt(0).then(function(o){
    if(my!==aiS.req)return;
    var nom=String(o.nom||name).trim()||name;
    var d={
      nom:nom,
      cat:normCat(cat,nom),
      personnes:Math.max(1,parseInt(o.personnes,10)||4),
      ing:o.ingredients.map(aiLine).filter(Boolean),
      steps:(Array.isArray(o.etapes)?o.etapes:[]).map(aiLine).map(function(x){return x.replace(/^\s*\d+\s*[.)\-:]\s*/,"");}).filter(Boolean)
    };
    aiDetailCache[name]=d;aiS.detail=d;aiS.dLoading=false;aiRender();
  }).catch(function(e){
    if(my!==aiS.req)return;
    aiS.dLoading=false;aiS.err=e.message||"Erreur";aiRender();
  });
}

function isFav(nom){return state.favs.some(function(f){return f.nom===nom;});}
function toggleFav(d){
  if(isFav(d.nom))state.favs=state.favs.filter(function(f){return f.nom!==d.nom;});
  else state.favs.push({nom:d.nom,cat:d.cat||catOfName(d.nom),personnes:d.personnes,ing:d.ing.slice(),steps:d.steps.slice()});
  save();aiRender();
}
function stepsText(d){return d.steps.map(function(x,i){return (i+1)+". "+x;}).join("\n");}
function aiUse(){
  var d=aiS.detail;if(!d)return;
  document.getElementById("f-name").value=d.nom;
  document.getElementById("f-ing").value=d.ing.join("\n");
  document.getElementById("f-steps").value=stepsText(d);
  document.getElementById("f-base").value=d.personnes;
  saveDraft();aiClose();toast("Recette ajoutée au formulaire");
}
function aiAddToMenu(day,slot){
  var d=aiS.detail;if(!d)return;
  var k=day+"-"+slot;
  if(state.meals[k]&&!confirm("Ce créneau est déjà rempli. Le remplacer ?"))return;
  state.meals[k]={name:d.nom,ing:d.ing.join("\n"),steps:stepsText(d),base:d.personnes,people:state.people||2};
  save();aiClose();go("week");toast("Repas ajouté au menu");
}

function aiRec(r,onpick){
  var b=el("button","rec");b.type="button";
  b.appendChild(el("strong","",r.nom));
  var sub=r.personnes?"Pour "+r.personnes+" personnes":[r.temps,r.description].filter(Boolean).join(" · ");
  if(sub)b.appendChild(el("small","",sub));
  b.addEventListener("click",onpick);
  aiPanel.appendChild(b);
}
function aiGrouped(items,onpick){
  CATS.forEach(function(c){
    var xs=items.filter(function(r){return (r.cat||"Plat")===c;});
    if(!xs.length)return;
    aiPanel.appendChild(el("h2","aisle",CATPL[c]+" ("+xs.length+")"));
    xs.forEach(function(r){aiRec(r,function(){onpick(r);});});
  });
}

function aiRender(){
  aiPanel.replaceChildren();
  if(aiS.view==="meal"){aiRenderMeal();return;}
  aiPanel.appendChild(el("h3","",(aiS.view==="fav"&&!aiS.inDetail)?"Mes favoris":"AI Hub · recettes"));
  if(aiS.inDetail){aiRenderDetail();return;}
  if(aiS.view==="fav"){aiRenderFav();return;}
  aiRenderSearch();
}

function aiRenderMeal(){
  var m=state.meals[aiS.mealKey];
  if(!m){aiClose();return;}
  aiPanel.appendChild(el("h3","",m.name||"Repas"));
  var f=(m.people&&m.base)?m.people/m.base:1;
  aiPanel.appendChild(el("p","hint",keyTitle(aiS.mealKey)+(m.people?" · pour "+m.people+" personnes":"")));
  var ings=(m.ing||"").split("\n").filter(function(l){return l.trim();});
  if(ings.length){
    aiPanel.appendChild(el("h2","aisle","Ingrédients"));
    ings.forEach(function(l){aiPanel.appendChild(el("div","ingl",scaledLine(l,f)));});
  }
  aiPanel.appendChild(el("h2","aisle","Étapes"));
  var st=(m.steps||"").split("\n").filter(function(l){return l.trim();});
  if(st.length)st.forEach(function(l){aiPanel.appendChild(el("p","stepl",l.trim()));});
  else aiPanel.appendChild(el("p","hint","Pas d’étapes enregistrées pour ce repas."));
  var acts=el("div","acts");
  var cl=el("button","btn","Fermer");cl.type="button";cl.addEventListener("click",aiClose);
  var ed=el("button","btn main","Modifier");ed.type="button";
  ed.addEventListener("click",function(){var k=aiS.mealKey;aiClose();openSheet(k,keyTitle(k));});
  acts.appendChild(cl);acts.appendChild(ed);aiPanel.appendChild(acts);
}

function aiRenderDetail(){
  var back=el("button","back","‹ Retour");back.type="button";
  back.addEventListener("click",function(){aiS.req++;aiS.inDetail=false;aiS.detail=null;aiS.dLoading=false;aiS.err="";aiRender();});
  aiPanel.appendChild(back);
  if(aiS.dLoading){aiPanel.appendChild(el("p","note","Je prépare la recette « "+aiS.dName+" »…"));return;}
  if(aiS.err||!aiS.detail){
    aiPanel.appendChild(el("p","note","Impossible : "+(aiS.err||"recette introuvable")));
    var rt=el("button","btn main","Réessayer");rt.type="button";rt.addEventListener("click",function(){aiDetail(aiS.dName,aiS.dCat);});aiPanel.appendChild(rt);
    return;
  }
  var d=aiS.detail;
  aiPanel.appendChild(el("h3","",d.nom));
  aiPanel.appendChild(el("p","hint",(d.cat||"Plat")+" · pour "+d.personnes+" personnes"));
  var fv=el("button","btn",isFav(d.nom)?"★ Retirer des favoris":"☆ Ajouter aux favoris");fv.type="button";
  fv.addEventListener("click",function(){toggleFav(d);});aiPanel.appendChild(fv);
  aiPanel.appendChild(el("h2","aisle","Ingrédients"));
  d.ing.forEach(function(x){aiPanel.appendChild(el("div","ingl",x));});
  aiPanel.appendChild(el("h2","aisle","Étapes"));
  var ol=el("ol","steps");d.steps.forEach(function(x){ol.appendChild(el("li","",x));});aiPanel.appendChild(ol);

  var acts=el("div","acts");acts.style.flexDirection="column";
  if(aiS.ctx==="sheet"){
    var u=el("button","btn main","Utiliser cette recette");u.type="button";u.addEventListener("click",aiUse);acts.appendChild(u);
  }else{
    var fr=nextFree({});
    var row=el("div","assign");
    var sd=sel("",DAYS.map(function(x,i){return [i,x];}),fr.day,"Jour",function(){});
    var ss=sel("",SLOTS,fr.slot,"Repas",function(){});
    row.appendChild(sd);row.appendChild(ss);acts.appendChild(row);
    var a=el("button","btn main","Ajouter au menu");a.type="button";
    a.addEventListener("click",function(){aiAddToMenu(+sd.value,ss.value);});acts.appendChild(a);
  }
  aiPanel.appendChild(acts);
}

function aiRenderFav(){
  var back=el("button","back","‹ Retour aux recherches");back.type="button";
  back.addEventListener("click",function(){aiS.view="search";aiRender();});
  aiPanel.appendChild(back);
  if(!state.favs.length){aiPanel.appendChild(el("p","note","Aucun favori pour l’instant. Ouvre une recette et touche « Ajouter aux favoris »."));return;}
  aiGrouped(state.favs,function(r){aiS.inDetail=true;aiS.err="";aiS.dLoading=false;aiS.detail=r;aiRender();});
}

function aiRenderSearch(){
  var lab=el("label","","Plat ou ingrédients");lab.htmlFor="ai-q";lab.style.marginTop="0";
  var inp=document.createElement("input");inp.type="text";inp.id="ai-q";inp.value=aiS.q;inp.placeholder="Ex. : poulet, riz, courgette";inp.autocomplete="off";
  inp.addEventListener("input",function(){aiS.q=inp.value;});
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();aiSearch(false);}});
  aiPanel.appendChild(lab);aiPanel.appendChild(inp);
  var bar=el("div","bar");bar.style.marginTop="10px";
  var go1=el("button","btn main","Chercher");go1.type="button";go1.addEventListener("click",function(){aiSearch(false);});
  var fv=el("button","btn","★ Favoris ("+state.favs.length+")");fv.type="button";fv.addEventListener("click",function(){aiS.view="fav";aiRender();});
  var cl=el("button","btn","Fermer");cl.type="button";cl.addEventListener("click",aiClose);
  bar.appendChild(go1);bar.appendChild(fv);bar.appendChild(cl);aiPanel.appendChild(bar);

  if(aiS.loading){aiPanel.appendChild(el("p","note","L’IA cherche des recettes…"));return;}
  if(aiS.err){
    aiPanel.appendChild(el("p","note","Impossible : "+aiS.err));
    var rt=el("button","btn main","Réessayer");rt.type="button";rt.addEventListener("click",function(){aiSearch(false);});aiPanel.appendChild(rt);
    return;
  }
  if(!aiS.list)return;
  aiGrouped(aiS.list,function(r){aiS.inDetail=true;aiDetail(r.nom,r.cat);});
  var gb=el("div","addbar");
  var more=el("button","btn main","↻ Générer d’autres recettes");more.type="button";more.addEventListener("click",function(){aiSearch(true);});
  gb.appendChild(more);aiPanel.appendChild(gb);
}
document.getElementById("f-ai").addEventListener("click",function(){
  aiOpen("sheet",document.getElementById("f-name").value.trim());
});

/* --- Web Share Target --- */
function checkSharedTarget() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('share') === 'true') {
    let sharedUrl = params.get('url') || params.get('text') || '';
    const match = sharedUrl.match(/https?:\/\/[^\s]+/);
    if (match) sharedUrl = match[0];

    if (sharedUrl && sharedUrl.includes('marmiton.org')) {
      go("week");
      setTimeout(() => {
        openSheet("0-m", "Lundi, midi");
        document.getElementById("f-url").value = sharedUrl;
        document.getElementById("f-import").click();
      }, 100);
    }
  }
}

/* PWA léger */
if("serviceWorker" in navigator){
  var sw=`self.addEventListener('install',e=>{self.skipWaiting()});self.addEventListener('activate',e=>{e.waitUntil(clients.claim())});self.addEventListener('fetch',e=>{e.respondWith(caches.open('menu-v2').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(e.request.method==='GET'&&res.ok)c.put(e.request,res.clone());return res}).catch(()=>caches.match('./'))))})`;
  var blob=new Blob([sw],{type:"text/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(){});
}

/* --- Restauration du brouillon au lancement --- */
try{
  var dr=JSON.parse(localStorage.getItem(DKEY)||"null");
  if(dr&&dr.key){
    openSheet(dr.key,dr.title);
    document.getElementById("f-name").value=dr.name;
    document.getElementById("f-url").value=dr.url;
    document.getElementById("f-ing").value=dr.ing;
    document.getElementById("f-steps").value=dr.steps||"";
    document.getElementById("f-base").value=dr.base;
    document.getElementById("f-ppl").value=dr.ppl;
  }
}catch(e){}

route();
setTimeout(checkSharedTarget, 100);
</script>
