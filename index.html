<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu de la semaine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF2F7;--surface:#fff;--ink:#17212B;--mute:#5B6773;--line:#D5DDE6;--acc:#2F7D4F;--accink:#fff;--warn:#C4402B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111A22;--surface:#1A2530;--ink:#EAF0F5;--mute:#9AA8B5;--line:#2C3A47;--acc:#5BBF86;--accink:#0E1A13;--warn:#F07A66}}
:root[data-theme="dark"]{--bg:#111A22;--surface:#1A2530;--ink:#EAF0F5;--mute:#9AA8B5;--line:#2C3A47;--acc:#5BBF86;--accink:#0E1A13;--warn:#F07A66}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin-inline:auto;padding:16px 16px 96px}
h1{font-size:28px;font-weight:800;margin:8px 0 14px;letter-spacing:-.02em}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:600 15px inherit;font-family:inherit;padding:10px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--accink)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.day.today{border-color:var(--acc);border-width:2px}
.day h2{font-size:17px;font-weight:800;margin:0;padding:12px 14px 6px}
.slot{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-family:inherit;padding:12px 14px;cursor:pointer}
.slot .when{flex:0 0 52px;color:var(--mute);font-size:14px}
.slot .what{flex:1}
.slot .what.empty{color:var(--mute)}
.slot small{display:block;color:var(--mute);font-size:13px}
.slot:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.row input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.row.done span{text-decoration:line-through;color:var(--mute)}
.bar{display:flex;gap:8px;margin-bottom:14px}
.btn{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px inherit;font-family:inherit;padding:12px;border-radius:12px;cursor:pointer}
.btn.main{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.warn{color:var(--warn)}
.aisle{font-size:15px;font-weight:800;color:var(--mute);margin:16px 2px 8px}
[hidden]{display:none!important}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.idea.on{border-color:var(--acc);border-width:2px}
.ichk{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.ichk input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin-top:2px}
.ichk small{display:block;color:var(--mute);font-size:13px}
.assign{display:flex;gap:8px;margin-top:10px}
.assign select{flex:1;min-width:0;font:inherit;font-size:16px;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.addbar{position:sticky;bottom:12px;margin-top:12px}
.addbar .btn{width:100%;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.note{color:var(--mute);padding:24px 8px;text-align:center}
#sheet{position:fixed;inset:0;background:rgba(10,16,22,.55);display:none;align-items:flex-end;z-index:20}
#sheet.open{display:flex}
#sheet form,#sheet .panel{width:100%;max-width:560px;margin-inline:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#sheet h3{margin:0 0 12px;font-size:20px;font-weight:800}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:130px;resize:vertical}
.hint{color:var(--mute);font-size:13px;margin:4px 0 0}
.acts{display:flex;gap:8px;margin-top:14px}
.sug{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:30vh;overflow:auto}
.sug .btn{text-align:left;font-weight:400}
#sheet form{max-height:92vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:30}
</style>
</head>
<body>
<h1>Menu de la semaine</h1>
<div class="tabs" role="tablist">
  <button role="tab" id="t-week" aria-selected="true">Repas</button>
  <button role="tab" id="t-idea" aria-selected="false">Idées</button>
  <button role="tab" id="t-list" aria-selected="false">Courses</button>
</div>
<main id="view"></main>

<div id="sheet" aria-hidden="true">
  <form id="form">
    <h3 id="sh-title"></h3>
    <label for="f-name">Repas</label>
    <input type="text" id="f-name" placeholder="Ex. : pâtes à la tomate" autocomplete="off">
    <div class="bar" style="margin:8px 0 0"><button type="button" class="btn" id="f-search">Chercher sur Marmiton</button></div>
    <label for="f-ing">Ingrédients (un par ligne)</label>
    <textarea id="f-ing" placeholder="400 g de pâtes&#10;3 tomates&#10;1 oignon"></textarea>
    <p class="hint">Quantité d’abord, puis l’ingrédient. Les doublons s’additionnent dans la liste de courses.</p>
    <div class="acts">
      <button type="button" class="btn warn" id="f-clear">Vider</button>
      <button type="button" class="btn" id="f-cancel">Fermer</button>
      <button type="submit" class="btn main">Enregistrer</button>
    </div>
  </form>
</div>
<div id="toast" role="status"></div>

<script>
var DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
var KEY="menu-semaine-v1";

var state={meals:{},checked:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.meals)state=p;if(!state.checked)state.checked={};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

var tab="week",editKey=null;
var view=document.getElementById("view");
var today=(new Date().getDay()+6)%7;

function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}

function ingCount(m){return m&&m.ing?m.ing.split("\n").filter(function(l){return l.trim();}).length:0;}

function renderWeek(){
  view.replaceChildren();
  DAYS.forEach(function(d,i){
    var card=el("section","day"+(i===today?" today":""));
    card.appendChild(el("h2","",d+(i===today?" (aujourd’hui)":"")));
    [["p","Matin"],["m","Midi"],["s","Soir"]].forEach(function(s){
      var key=i+"-"+s[0],m=state.meals[key];
      var b=el("button","slot");b.type="button";
      b.appendChild(el("span","when",s[1]));
      var w=el("span","what"+(m&&m.name?"":" empty"),m&&m.name?m.name:"Ajouter un repas");
      if(m&&m.name&&ingCount(m)){w.appendChild(el("small","",ingCount(m)+" ingrédient"+(ingCount(m)>1?"s":"")));}
      b.appendChild(w);
      b.addEventListener("click",function(){openSheet(key,d+", "+s[1].toLowerCase());});
      card.appendChild(b);
    });
    view.appendChild(card);
  });
}

var RX=/^(\d+(?:[.,]\d+)?)\s*(kg|g|l|ml|cl)?\s+(?:de\s+|d’|d')?(.+)$/i;
function buildList(){
  var map={};
  Object.keys(state.meals).forEach(function(k){
    var m=state.meals[k];if(!m||!m.ing)return;
    m.ing.split("\n").forEach(function(line){
      line=line.trim();if(!line)return;
      var q=null,u="",n=line,r=RX.exec(line);
      if(r){q=parseFloat(r[1].replace(",","."));u=(r[2]||"").toLowerCase();n=r[3].trim();}
      if(u==="kg"){q*=1000;u="g";}else if(u==="l"){q*=1000;u="ml";}else if(u==="cl"){q*=10;u="ml";}
      var id=n.toLowerCase()+"|"+u;
      if(!map[id])map[id]={id:id,name:n,unit:u,qty:0,hasQty:false};
      if(q!=null){map[id].qty+=q;map[id].hasQty=true;}else{map[id].qty+=1;map[id].hasQty=true;}
    });
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return a.name.localeCompare(b.name,"fr");});
}
function fmt(it){
  var q=it.qty,u=it.unit;
  if(u==="g"&&q>=1000){q=q/1000;u="kg";}
  if(u==="ml"&&q>=1000){q=q/1000;u="l";}
  q=Math.round(q*100)/100;
  var s=String(q).replace(".",",");
  return s+(u?" "+u:"")+" "+it.name;
}

var AISLES=["Fruits et légumes","Viandes et poissons","Produits frais","Épicerie","Autres"];
var KW=[
 "tomate carotte oignon ail échalote courgette aubergine poivron patate champignon salade laitue épinard concombre poireau chou brocoli haricot citron orange pomme banane fraise persil basilic coriandre ciboulette thym menthe gingembre avocat céleri navet radis fruit légume potiron courge maïs",
 "poulet dinde boeuf bœuf veau porc agneau jambon lardon saucisse steak viande saumon thon cabillaud poisson crevette moule merlu canard",
 "lait crème fromage beurre yaourt oeuf œuf mozzarella parmesan gruyère emmental feta",
 "pâtes riz farine sucre sel poivre huile vinaigre sauce conserve lentille chiche semoule quinoa pain épice moutarde bouillon chocolat miel levure"];
function aisle(n){
  var tk=n.toLowerCase().split(/[^a-zàâçéèêëîïôûùüœ]+/);
  for(var i=0;i<KW.length;i++){var ws=KW[i].split(" ");
    for(var j=0;j<ws.length;j++){if(tk.some(function(t){return t===ws[j]||t===ws[j]+"s"||t===ws[j]+"x";}))return AISLES[i];}}
  return AISLES[4];
}
function renderList(){
  view.replaceChildren();
  var items=buildList();
  if(!items.length){view.appendChild(el("p","note","Ajoute des ingrédients à tes repas : la liste se remplit toute seule."));return;}
  var bar=el("div","bar");
  var c=el("button","btn main","Copier la liste");c.type="button";
  var r=el("button","btn","Tout décocher");r.type="button";
  c.addEventListener("click",copyList);
  r.addEventListener("click",function(){state.checked={};save();renderList();});
  bar.appendChild(c);bar.appendChild(r);view.appendChild(bar);
  var last="";
  items.sort(function(a,b){var x=aisle(a.name),y=aisle(b.name);return x!==y?AISLES.indexOf(x)-AISLES.indexOf(y):a.name.localeCompare(b.name,"fr");});
  items.forEach(function(it){
    var ay=aisle(it.name);if(ay!==last){view.appendChild(el("h2","aisle",ay));last=ay;}
    var row=el("label","row"+(state.checked[it.id]?" done":""));
    var cb=document.createElement("input");cb.type="checkbox";cb.checked=!!state.checked[it.id];
    cb.addEventListener("change",function(){if(cb.checked)state.checked[it.id]=1;else delete state.checked[it.id];save();row.classList.toggle("done",cb.checked);});
    row.appendChild(cb);row.appendChild(el("span","",fmt(it)));
    view.appendChild(row);
  });
}
function copyList(){
  var txt=buildList().filter(function(it){return !state.checked[it.id];}).map(function(it){return "- "+fmt(it);}).join("\n");
  var done=function(ok){toast(ok?"Liste copiée":"Copie impossible");};
  try{navigator.clipboard.writeText(txt).then(function(){done(true);},function(){done(false);});}catch(e){done(false);}
}
var tt;function toast(t){var n=document.getElementById("toast");n.textContent=t;n.style.display="block";clearTimeout(tt);tt=setTimeout(function(){n.style.display="none";},1800);}

function render(){
  document.getElementById("t-week").setAttribute("aria-selected",tab==="week");
  document.getElementById("t-idea").setAttribute("aria-selected",tab==="idea");
  document.getElementById("t-list").setAttribute("aria-selected",tab==="list");
  if(tab==="week")renderWeek();else if(tab==="idea")renderIdeas();else renderList();
}
document.getElementById("t-week").addEventListener("click",function(){tab="week";render();});
document.getElementById("t-idea").addEventListener("click",function(){tab="idea";render();});
document.getElementById("t-list").addEventListener("click",function(){tab="list";render();});

var sheet=document.getElementById("sheet");
function openSheet(key,title){
  editKey=key;var m=state.meals[key]||{name:"",ing:""};
  document.getElementById("sh-title").textContent=title;
  document.getElementById("f-name").value=m.name||"";
  document.getElementById("f-ing").value=m.ing||"";
  sheet.classList.add("open");sheet.setAttribute("aria-hidden","false");
  setTimeout(function(){document.getElementById("f-name").focus();},50);
}
function closeSheet(){sheet.classList.remove("open");sheet.setAttribute("aria-hidden","true");editKey=null;}
document.getElementById("form").addEventListener("submit",function(e){
  e.preventDefault();
  var name=document.getElementById("f-name").value.trim(),ing=document.getElementById("f-ing").value;
  if(name||ing.trim())state.meals[editKey]={name:name,ing:ing};else delete state.meals[editKey];
  save();closeSheet();render();
});
document.getElementById("f-cancel").addEventListener("click",closeSheet);
document.getElementById("f-clear").addEventListener("click",function(){delete state.meals[editKey];save();closeSheet();render();});
sheet.addEventListener("click",function(e){if(e.target===sheet)closeSheet();});
function decode(t){var n=document.createElement("textarea");n.innerHTML=t;return n.value;}
document.getElementById("f-search").addEventListener("click",function(){
  var q=document.getElementById("f-name").value.trim();
  if(!q){toast("Saisis d’abord le nom du repas");return;}
  window.open("https://www.marmiton.org/recettes/recherche.aspx?aqt="+encodeURIComponent(q),"_blank","noopener");
});
var MEALDB="https://www.themealdb.com/api/json/v1/1/";
function trList(list,from,to){
  var chunks=[],cur=[],len=0;
  list.forEach(function(t){if(len+t.length>400&&cur.length){chunks.push(cur);cur=[];len=0;}cur.push(t);len+=t.length+1;});
  if(cur.length)chunks.push(cur);
  return Promise.all(chunks.map(function(c){
    return fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(c.join("\n"))+"&langpair="+from+"|"+to)
      .then(function(r){return r.json();})
      .then(function(d){
        var out=d&&d.responseStatus===200&&d.responseData?String(d.responseData.translatedText).split("\n"):null;
        return out&&out.length===c.length?out:c;
      }).catch(function(){return c;});
  })).then(function(parts){return [].concat.apply([],parts);});
}
var ideas={q:"",list:null,loading:false,sel:{}};
var SLOTS=[["p","Matin"],["m","Midi"],["s","Soir"]];
var LEVELS=["Faciles","Intermédiaires","Élaborées"];
var rawCache={};
function getMeal(id){
  if(rawCache[id])return Promise.resolve(rawCache[id]);
  return fetch(MEALDB+"lookup.php?i="+encodeURIComponent(id)).then(function(x){return x.json();}).then(function(d){
    var m=(d.meals||[])[0]||null;if(m)rawCache[id]=m;return m;
  });
}
function countIng(m){var n=0;for(var i=1;i<=20;i++)if((m["strIngredient"+i]||"").trim())n++;return n;}
function levelOf(n){return n<=7?0:n<=12?1:2;}
function api(p){
  return getMeal(p.id).then(function(m){
    if(!m)return {};
    var lines=[];
    for(var i=1;i<=20;i++){var g=(m["strIngredient"+i]||"").trim(),q=(m["strMeasure"+i]||"").trim();if(g)lines.push((q+" "+g).trim());}
    return trList([m.strMeal].concat(lines),"en","fr").then(function(t){return {name:t[0],ingredients:t.slice(1)};});
  });
}
function nextFree(taken){
  for(var d=0;d<7;d++){for(var j=2;j>=1;j--){
    var k=d+"-"+SLOTS[j][0];if(!state.meals[k]&&!taken[k])return {day:d,slot:SLOTS[j][0]};
  }}
  return {day:0,slot:"s"};
}
function terms(){return ideas.q.split(/[,;\n]+/).map(function(t){return t.trim();}).filter(Boolean).slice(0,4);}
function searchIdeas(){
  var ts=terms();
  if(!ts.length){toast("Saisis au moins un ingrédient");return;}
  ideas.loading=true;ideas.list=null;ideas.sel={};renderIdeas();
  trList(ts,"fr","en").then(function(en){
    return Promise.all(en.map(function(t){
      return fetch(MEALDB+"filter.php?i="+encodeURIComponent(t.toLowerCase().trim().replace(/\s+/g,"_")))
        .then(function(x){return x.json();}).then(function(d){return d.meals||[];}).catch(function(){return [];});
    }));
  }).then(function(res){
    var map={};
    res.forEach(function(ms){ms.forEach(function(m){
      if(!map[m.idMeal])map[m.idMeal]={id:m.idMeal,en:m.strMeal,hits:0};
      map[m.idMeal].hits++;
    });});
    var arr=Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return b.hits-a.hits;}).slice(0,15);
    return Promise.all(arr.map(function(a){
      return getMeal(a.id).then(function(m){a.n=m?countIng(m):10;return a;}).catch(function(){a.n=10;return a;});
    })).then(function(arr){
      return trList(arr.map(function(a){return a.en;}),"en","fr").then(function(names){
        arr.forEach(function(a,i){a.name=names[i];a.t=ts.length;});return arr;
      });
    });
  }).then(function(arr){ideas.list=arr;ideas.loading=false;renderIdeas();})
  .catch(function(){ideas.loading=false;ideas.list=[];renderIdeas();toast("Recherche impossible");});
}
function addSelected(){
  var ids=Object.keys(ideas.sel);if(!ids.length)return;
  var keys={},dup=false,over=0;
  ids.forEach(function(id){var s=ideas.sel[id],k=s.day+"-"+s.slot;if(keys[k])dup=true;keys[k]=id;if(state.meals[k])over++;});
  if(dup){toast("Deux recettes sont sur le même créneau");return;}
  if(over&&!confirm(over+(over>1?" créneaux sont déjà remplis":" créneau est déjà rempli")+". Les remplacer ?"))return;
  toast("Ajout en cours…");
  Promise.all(ids.map(function(id){return api({action:"meal",id:id}).then(function(r){return {id:id,r:r};});})).then(function(rs){
    var n=0;
    rs.forEach(function(x){
      if(!x.r||!x.r.ingredients)return;
      var s=ideas.sel[x.id];state.meals[s.day+"-"+s.slot]={name:x.r.name,ing:x.r.ingredients.join("\n")};n++;
    });
    save();ideas.sel={};tab="week";render();toast(n+(n>1?" repas ajoutés":" repas ajouté"));
  }).catch(function(){toast("Ajout impossible");});
}
function sel(cls,opts,val,label,onch){
  var s=el("select");s.setAttribute("aria-label",label);
  opts.forEach(function(o,i){var op=document.createElement("option");op.value=o[0];op.textContent=o[1];if(String(o[0])===String(val))op.selected=true;s.appendChild(op);});
  s.addEventListener("change",function(){onch(s.value);});return s;
}
function renderIdeas(){
  view.replaceChildren();
  var lab=el("label","","Tes ingrédients, séparés par une virgule");lab.htmlFor="i-q";lab.style.marginTop="0";
  var inp=document.createElement("input");inp.type="text";inp.id="i-q";inp.value=ideas.q;inp.placeholder="Ex. : poulet, tomate, riz";inp.autocomplete="off";
  inp.addEventListener("input",function(){ideas.q=inp.value;});
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();searchIdeas();}});
  view.appendChild(lab);view.appendChild(inp);
  var bar=el("div","bar");bar.style.marginTop="10px";
  var b1=el("button","btn main","Trouver des recettes");b1.type="button";b1.addEventListener("click",searchIdeas);
  var b2=el("button","btn","Chercher sur Marmiton");b2.type="button";
  b2.addEventListener("click",function(){
    var q=terms().join(" ");if(!q){toast("Saisis au moins un ingrédient");return;}
    window.open("https://www.marmiton.org/recettes/recherche.aspx?aqt="+encodeURIComponent(q),"_blank","noopener");
  });
  bar.appendChild(b1);bar.appendChild(b2);view.appendChild(bar);
  if(ideas.loading){view.appendChild(el("p","note","Recherche en cours…"));return;}
  if(!ideas.list)return;
  if(!ideas.list.length){view.appendChild(el("p","note","Aucune recette trouvée. Essaie un ingrédient plus courant ou moins d’ingrédients."));return;}
  var addbar=el("div","addbar");var addBtn=el("button","btn main","");addBtn.type="button";addBtn.addEventListener("click",addSelected);addbar.appendChild(addBtn);
  function updateBar(){var n=Object.keys(ideas.sel).length;addbar.hidden=!n;addBtn.textContent="Ajouter "+n+(n>1?" recettes":" recette")+" au menu";}
  [0,1,2].forEach(function(lv){
    var items=ideas.list.filter(function(a){return levelOf(a.n)===lv;});
    if(!items.length)return;
    view.appendChild(el("h2","aisle",LEVELS[lv]+" ("+items.length+")"));
    items.forEach(function(a){
      var on=!!ideas.sel[a.id];
      var card=el("div","idea"+(on?" on":""));
      var l=el("label","ichk");var cb=document.createElement("input");cb.type="checkbox";cb.checked=on;
      var tx=el("span","",a.name);
      tx.appendChild(el("small","",a.n+" ingrédients"+(a.t>1?", "+a.hits+" sur "+a.t+" de tes ingrédients":"")));
      l.appendChild(cb);l.appendChild(tx);card.appendChild(l);
      var as=el("div","assign");as.hidden=!on;
      var cur=ideas.sel[a.id]||{day:0,slot:"s"};
      as.appendChild(sel("",DAYS.map(function(d,i){return [i,d];}),cur.day,"Jour",function(v){ideas.sel[a.id].day=+v;}));
      as.appendChild(sel("",SLOTS,cur.slot,"Repas",function(v){ideas.sel[a.id].slot=v;}));
      card.appendChild(as);
      cb.addEventListener("change",function(){
        if(cb.checked){var taken={};Object.keys(ideas.sel).forEach(function(i){taken[ideas.sel[i].day+"-"+ideas.sel[i].slot]=1;});
          var f=nextFree(taken);ideas.sel[a.id]=f;
          as.replaceChildren();
          as.appendChild(sel("",DAYS.map(function(d,i){return [i,d];}),f.day,"Jour",function(v){ideas.sel[a.id].day=+v;}));
          as.appendChild(sel("",SLOTS,f.slot,"Repas",function(v){ideas.sel[a.id].slot=v;}));
        }else delete ideas.sel[a.id];
        as.hidden=!cb.checked;card.classList.toggle("on",cb.checked);updateBar();
      });
      view.appendChild(card);
    });
  });
  view.appendChild(addbar);updateBar();
}

render();
</script>
