<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F7D4F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Menu de la semaine</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF2F7;--surface:#fff;--ink:#17212B;--mute:#5B6773;--line:#D5DDE6;--acc:#2F7D4F;--accink:#fff;--warn:#C4402B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111A22;--surface:#1A2530;--ink:#EAF0F5;--mute:#9AA8B5;--line:#2C3A47;--acc:#5BBF86;--accink:#0E1A13;--warn:#F07A66}}
:root[data-theme="dark"]{--bg:#111A22;--surface:#1A2530;--ink:#EAF0F5;--mute:#9AA8B5;--line:#2C3A47;--acc:#5BBF86;--accink:#0E1A13;--warn:#F07A66}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin-inline:auto;padding:16px 16px 96px}
h1{font-size:28px;font-weight:800;margin:8px 0 14px;letter-spacing:-.02em}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:600 15px inherit;font-family:inherit;padding:10px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--accink)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.day.today{border-color:var(--acc);border-width:2px}
.day h2{font-size:17px;font-weight:800;margin:0;padding:12px 14px 6px}
.slot{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-family:inherit;padding:12px 14px;cursor:pointer;transition:background .15s}
.slot:active{background:var(--bg)}
.slot .when{flex:0 0 52px;color:var(--mute);font-size:14px}
.slot .what{flex:1}
.slot .what.empty{color:var(--mute)}
.slot small{display:block;color:var(--mute);font-size:13px}
.slot:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:opacity .15s}
.row input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.row.done span{text-decoration:line-through;color:var(--mute)}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.btn{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px inherit;font-family:inherit;padding:12px;border-radius:12px;cursor:pointer;min-width:0;transition:transform .1s,background .15s}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.warn{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.aisle{font-size:15px;font-weight:800;color:var(--mute);margin:16px 2px 8px}
[hidden]{display:none!important}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;transition:border-color .2s,border-width .2s}
.idea.on{border-color:var(--acc);border-width:2px}
.ichk{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.ichk input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin-top:2px}
.ichk small{display:block;color:var(--mute);font-size:13px}
.preview{font-size:13px;color:var(--mute);margin:8px 0 0 34px;line-height:1.35}
.assign{display:flex;gap:8px;margin-top:10px}
.assign select{flex:1;min-width:0;font:inherit;font-size:16px;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.addbar{position:sticky;bottom:12px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.addbar .btn{width:100%;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.back{border:0;background:none;color:var(--acc);font:600 17px inherit;font-family:inherit;padding:8px 0;cursor:pointer}
.tile{display:flex;align-items:center;gap:18px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:22px 20px;margin-bottom:14px;font:inherit;font-family:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tile:active{transform:scale(.985)}
.tile .ico{flex:none;width:76px;height:76px;border-radius:20px;background:var(--acc);color:var(--accink);display:grid;place-items:center}
.tile .ico svg{width:44px;height:44px}
.tile .tt{font-size:24px;font-weight:800;letter-spacing:-.01em}
.tile .tt small{display:block;font-size:14px;font-weight:400;color:var(--mute);margin-top:2px}
.tile:focus-visible,.back:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.note{color:var(--mute);padding:24px 8px;text-align:center}
#sheet,#aisheet{position:fixed;inset:0;background:rgba(10,16,22,0);display:flex;align-items:flex-end;z-index:20;pointer-events:none;transition:background .25s}
#sheet.open,#aisheet.open{background:rgba(10,16,22,.55);pointer-events:auto}
#aisheet{z-index:25}
#sheet form,#sheet .panel,#aisheet .panel{width:100%;max-width:560px;margin-inline:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:0;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.open form,#sheet.open .panel,#aisheet.open .panel{transform:translateY(0)}
#aisheet .panel{display:flex;flex-direction:column;height:88vh;height:88dvh;max-height:92vh;overflow:hidden}
#sheet h3,#aisheet h3{margin:0 0 12px;font-size:20px;font-weight:800}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;font-size:16px;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:130px;resize:vertical}
.hint{color:var(--mute);font-size:13px;margin:4px 0 0}
.acts{display:flex;gap:8px;margin-top:14px}
.sug{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:30vh;overflow:auto}
.sug .btn{text-align:left;font-weight:400}
#sheet form{display:flex;flex-direction:column;max-height:92vh;overflow:hidden}
.rec{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--ink);font:inherit;font-family:inherit;cursor:pointer}
.rec:active{transform:scale(.99)}
.rec strong{display:block;font-weight:800}
.rec small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.ingl{padding:8px 0;border-top:1px solid var(--line)}
.steps{margin:0 0 8px;padding-left:22px}
.steps li{margin-bottom:10px}
.slotwrap{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.slotwrap .slot{border-top:0;width:auto;flex:1;min-width:0}
.recbtn{flex:none;border:0;border-left:1px solid var(--line);background:none;color:var(--acc);font-weight:600;font-size:14px;font-family:inherit;padding:0 14px;cursor:pointer}
.stepl{margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.stats{display:flex;gap:10px;margin-bottom:18px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat strong{display:block;font-size:22px;font-weight:800}
.stat span{font-size:13px;color:var(--mute)}

/* ---------- Polish v4 : gros boutons, cartes, fluidité ---------- */
*{-webkit-tap-highlight-color:transparent}
button,.row,.tile,.slot,select{touch-action:manipulation}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#view.enter{animation:rise .22s ease both}
@media (prefers-reduced-motion:reduce){#view.enter{animation:none}}
h1{font-size:30px}
.btn{min-height:50px;padding:13px 14px;border-radius:14px;font-size:16px}
.back{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px 8px 10px;margin:0 0 4px -10px;font-size:17px;border-radius:12px}
.back:active{background:var(--surface)}
.tabs button{min-height:44px}
.day,.row,.idea,.stat,.tile,.rec{box-shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.04)}
.slot{padding:15px 14px}
.row{min-height:56px}
.tile{padding:20px}
.grab{flex:none;width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 6px}
.sh-body{flex:1;min-height:0;overflow:auto;padding:4px 16px 14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-foot{flex:none;margin:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.sh-foot .btn{min-height:56px;font-size:17px;border-radius:16px}
.sh-foot .btn.main{flex:1.6}
.sh-foot .btn.warn{flex:.8}
.mhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-family:inherit;padding:14px;min-height:64px;cursor:pointer}
.mhead .mt{flex:1;min-width:0}
.mhead .mt b{display:block;font-weight:800;font-size:17px}
.mhead small{display:block;color:var(--mute);font-size:13px}
.mhead .chev{flex:none;color:var(--mute);font-size:24px;transition:transform .2s}
.mcard.open .chev{transform:rotate(90deg)}
.mbody{border-top:1px solid var(--line);padding:12px 12px 6px}
.mbody .row{box-shadow:none}
.mbody .btn{width:100%;margin-bottom:8px}
</style>
</head>
<body>
<header id="top"></header>
<main id="view"></main>

<div id="sheet" aria-hidden="true">
  <form id="form">
    <div class="grab"></div>
    <div class="sh-body">
    <h3 id="sh-title"></h3>
    <label for="f-name">Repas</label>
    <input type="text" id="f-name" placeholder="Ex. : pâtes à la tomate" autocomplete="off">
    <div class="bar" style="margin:8px 0 0"><button type="button" class="btn" id="f-search">Chercher sur Marmiton</button><button type="button" class="btn main" id="f-ai">Chercher sur AI Hub</button></div>

    <label for="f-url">Lien d’une recette</label>
    <div style="display:flex; gap:8px; margin-bottom: 8px;">
      <input type="text" id="f-url" inputmode="url" placeholder="https://www.marmiton.org/…" autocomplete="off" style="flex:1;">
      <button type="button" class="btn main" id="f-paste" style="flex:0 0 auto; padding:10px 16px; font-weight:800;">Coller</button>
    </div>

    <div class="bar" style="margin:8px 0 0"><button type="button" class="btn" id="f-import">Importer les ingrédients</button></div>
    <label for="f-ing">Ingrédients (un par ligne)</label>
    <textarea id="f-ing" placeholder="400 g de pâtes&#10;3 tomates&#10;1 oignon"></textarea>
    <label for="f-steps">Étapes (facultatif)</label>
    <textarea id="f-steps" style="min-height:90px" placeholder="1. Faire cuire les pâtes…"></textarea>
    <div class="bar" style="margin:12px 0 0">
      <div style="flex:1"><label for="f-base" style="margin-top:0">Recette pour</label><input type="number" id="f-base" min="1" max="99" inputmode="numeric"></div>
      <div style="flex:1"><label for="f-ppl" style="margin-top:0">Je cuisine pour</label><input type="number" id="f-ppl" min="1" max="99" inputmode="numeric"></div>
    </div>
    <p class="hint">Quantité d’abord, puis l’ingrédient. Les doublons s’additionnent dans la liste de courses.</p>
    </div>
    <div class="acts sh-foot">
      <button type="button" class="btn warn" id="f-clear">Vider</button>
      <button type="button" class="btn" id="f-cancel">Fermer</button>
      <button type="submit" class="btn main">Enregistrer</button>
    </div>
  </form>
</div>
<div id="aisheet" aria-hidden="true"><div class="panel"><div class="grab"></div><div id="ai-panel" class="sh-body"></div><div id="ai-foot" class="acts sh-foot" hidden></div></div></div>
<div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
/* Menu de la semaine – v5 (sync Firebase) */
var DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
var KEY="menu-semaine-v1";
var DKEY="menu-draft";
var FAMILY_KEY="menu-family-code";

/* ---------- Firebase ---------- */
var firebaseConfig = {
  apiKey: "AIzaSyCgaXapgiYiQhQA46W5l-P_sJgXOkOest8",
  authDomain: "menu-semaine-e6abe.firebaseapp.com",
  databaseURL: "https://menu-semaine-e6abe-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "menu-semaine-e6abe",
  storageBucket: "menu-semaine-e6abe.firebasestorage.app",
  messagingSenderId: "348414840788",
  appId: "1:348414840788:web:d1ee0d3bdca9bb6281d041"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var auth = firebase.auth();

var familyCode = localStorage.getItem(FAMILY_KEY) || null;
var syncReady = false;
var applyingRemote = false; // évite les boucles save → remote → save

var state={meals:{},checked:{},people:2,favs:[],appliances:["four","plaques"]};
try{
  var raw=localStorage.getItem(KEY);
  if(raw){
    var p=JSON.parse(raw);
    if(p&&p.meals)state=p;
    if(!state.checked)state.checked={};
    if(!state.people)state.people=2;
    if(!state.favs)state.favs=[];
    if(!state.appliances)state.appliances=["four","plaques"];
  }
}catch(e){}

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  if(syncReady && familyCode && !applyingRemote){
    db.ref("families/"+familyCode+"/data").set(state).catch(function(err){
      console.warn("Sync write error", err);
      toast("Erreur de synchronisation");
    });
  }
}

function generateFamilyCode(){
  var chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var code="";
  for(var i=0;i<6;i++) code+=chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function startSync(code){
  if(!authReady && !auth.currentUser){
    toast("Connexion en cours… réessaie dans 2 secondes");
    setTimeout(function(){ startSync(code); }, 1500);
    return;
  }
  code = String(code||"").trim().toUpperCase();
  if(!code){toast("Code invalide");return;}

  familyCode = code;
  localStorage.setItem(FAMILY_KEY, code);
  syncReady = true;

  // Écoute en temps réel
  db.ref("families/"+code+"/data").off(); // évite les doubles listeners
  db.ref("families/"+code+"/data").on("value", function(snap){
    var remote = snap.val();
    if(!remote){
      // Première fois : on pousse l’état local
      db.ref("families/"+code+"/data").set(state).then(function(){
        toast("Espace créé · code "+code);
      }).catch(function(err){
        console.warn(err);
        toast("Erreur écriture : "+(err.message||err.code||""));
      });
      return;
    }
    // On applique les données distantes
    applyingRemote = true;
    state = remote;
    if(!state.checked)state.checked={};
    if(!state.people)state.people=2;
    if(!state.favs)state.favs=[];
    if(!state.appliances)state.appliances=["four","plaques"];
    try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
    applyingRemote = false;
    render();
  }, function(err){
    console.warn("Sync listen error", err);
    toast("Impossible de synchroniser : "+(err.message||err.code||""));
  });
}

function leaveFamily(){
  if(familyCode){
    db.ref("families/"+familyCode+"/data").off();
  }
  familyCode = null;
  localStorage.removeItem(FAMILY_KEY);
  syncReady = false;
  toast("Synchronisation désactivée");
  render();
}

function openSyncSheet(){
  aiS.view = "sync";
  aiShow();
  aiPanel.replaceChildren();
  aiPanel.appendChild(el("h3","","Synchronisation"));
  
  if(familyCode){
    aiPanel.appendChild(el("p","hint","Les deux téléphones partagent le même menu."));
    aiPanel.appendChild(el("p","","Code famille :"));
    var codeBox = el("div","");
    codeBox.style.cssText = "font-size:28px;font-weight:800;letter-spacing:4px;text-align:center;padding:16px;background:var(--bg);border-radius:12px;margin:8px 0 16px";
    codeBox.textContent = familyCode;
    aiPanel.appendChild(codeBox);
    
    var copyBtn = el("button","btn main","Copier le code");
    copyBtn.type="button";
    copyBtn.style.width="100%";
    copyBtn.addEventListener("click", function(){
      navigator.clipboard.writeText(familyCode).then(function(){toast("Code copié");}).catch(function(){toast("Copie impossible");});
    });
    aiPanel.appendChild(copyBtn);
    
    var leaveBtn = el("button","btn warn","Quitter ce partage");
    leaveBtn.type="button";
    leaveBtn.style.width="100%";
    leaveBtn.style.marginTop="10px";
    leaveBtn.addEventListener("click", function(){
      if(confirm("Arrêter la synchronisation sur cet appareil ?")){
        leaveFamily();
        aiClose();
      }
    });
    aiPanel.appendChild(leaveBtn);
  } else {
    aiPanel.appendChild(el("p","hint","Crée un code pour partager le menu avec un autre téléphone, ou rejoins un code existant."));
    
    var createBtn = el("button","btn main","Créer un nouveau code famille");
    createBtn.type="button";
    createBtn.style.width="100%";
    createBtn.style.marginBottom="16px";
    createBtn.addEventListener("click", function(){
      var code = generateFamilyCode();
      startSync(code);
      toast("Code créé : "+code);
      openSyncSheet(); // rafraîchit l’affichage
    });
    aiPanel.appendChild(createBtn);
    
    aiPanel.appendChild(el("label","","Rejoindre avec un code"));
    var inp = document.createElement("input");
    inp.type="text";
    inp.id="sync-code";
    inp.placeholder="Ex. : A7K9P2";
    inp.style.textTransform="uppercase";
    inp.maxLength=6;
    aiPanel.appendChild(inp);
    
    var joinBtn = el("button","btn main","Rejoindre");
    joinBtn.type="button";
    joinBtn.style.width="100%";
    joinBtn.style.marginTop="10px";
    joinBtn.addEventListener("click", function(){
      var code = (inp.value||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
      if(code.length < 4){toast("Code trop court");return;}
      startSync(code);
      toast("Connecté au code "+code);
      aiClose();
      render();
    });
    aiPanel.appendChild(joinBtn);
  }
  
  aiFoot.replaceChildren();
  var closeB = el("button","btn","Fermer");
  closeB.type="button";
  closeB.addEventListener("click", aiClose);
  aiFoot.appendChild(closeB);
  aiFoot.hidden = false;
}

/* Auth anonyme au démarrage */
var authReady = false;
auth.onAuthStateChanged(function(user){
  if(user){
    authReady = true;
    console.log("Firebase auth OK", user.uid);
    if(familyCode && !syncReady) startSync(familyCode);
  }
});
auth.signInAnonymously().catch(function(err){
  console.warn("Auth error", err);
  toast("Connexion cloud impossible : "+(err.message||err.code||"erreur"));
});


var tab="home",editKey=null;
var view=document.getElementById("view");
var today=(new Date().getDay()+6)%7;

function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}

function ingCount(m){return m&&m.ing?m.ing.split("\n").filter(function(l){return l.trim();}).length:0;}

function renderWeek(){
  view.replaceChildren();
  DAYS.forEach(function(d,i){
    var card=el("section","day"+(i===today?" today":""));
    card.appendChild(el("h2","",d+(i===today?" (aujourd’hui)":"")));
    SLOTS.forEach(function(s){
      var key=i+"-"+s[0],m=state.meals[key];
      var b=el("button","slot");b.type="button";
      b.appendChild(el("span","when",s[1]));
      var w=el("span","what"+(m&&m.name?"":" empty"),m&&m.name?m.name:"Ajouter un repas");
      if(m&&m.name&&ingCount(m)){w.appendChild(el("small","",ingCount(m)+" ingrédient"+(ingCount(m)>1?"s":"")+(m.people?", "+m.people+" pers.":"")));}
      b.appendChild(w);
      b.addEventListener("click",function(){openSheet(key,d+", "+s[1].toLowerCase());});
      var wrap=el("div","slotwrap");wrap.appendChild(b);
      if(m&&m.name&&(ingCount(m)||(m.steps&&m.steps.trim()))){
        var rb=el("button","recbtn","Recette");rb.type="button";
        rb.addEventListener("click",function(){aiOpenMeal(key);});
        wrap.appendChild(rb);
      }
      card.appendChild(wrap);
    });

var RX=/^(\d+(?:[.,]\d+)?|\d\/\d|[½¼¾])\s*(kg|g|l|ml|cl)?\s+(?:de\s+|d’|d')?(.+)$/i;
function toNum(x){var F={"½":.5,"¼":.25,"¾":.75};if(F[x])return F[x];if(x.indexOf("/")>0){var a=x.split("/");return (+a[0])/(+a[1]||1);}return parseFloat(String(x).replace(",","."))||0;}

function buildList(){
  var map={};
  Object.keys(state.meals).forEach(function(k){
    var m=state.meals[k];if(!m||!m.ing)return;var f=(m.people&&m.base)?m.people/m.base:1;
    m.ing.split("\n").forEach(function(line){
      line=line.trim();if(!line)return;
      var q=null,u="",n=line,r=RX.exec(line);
      if(r){q=toNum(r[1]);u=(r[2]||"").toLowerCase();n=r[3].trim();}
      if(u==="kg"){q*=1000;u="g";}else if(u==="l"){q*=1000;u="ml";}else if(u==="cl"){q*=10;u="ml";}
      var id=n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")+"|"+u;
      if(!map[id])map[id]={id:id,name:n,unit:u,qty:0};
      if(q!=null)map[id].qty+=q*f;
    });
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return a.name.localeCompare(b.name,"fr");});
}
function fmt(it){
  var q=it.qty,u=it.unit;if(!q)return it.name;if(!u)q=Math.ceil(q-1e-9);
  if(u==="g"&&q>=1000){q=q/1000;u="kg";}
  if(u==="ml"&&q>=1000){q=q/1000;u="l";}
  q=Math.round(q*100)/100;
  var s=String(q).replace(".",",");
  if(u&&!/^(de |d’|d')/i.test(it.name))return s+" "+u+" "+(/^(h(?!aricot|achis|omard|arissa|alloumi|oumous|ot)|[aeiouyàâäéèêëîïôöùûü])/i.test(it.name)?"d’":"de ")+it.name;
  return s+(u?" "+u:"")+" "+it.name;
}

function aisle(n){

var MEALDB="https://www.themealdb.com/api/json/v1/1/";
function trList(list,from,to){
  var chunks=[],cur=[],len=0;
  list.forEach(function(t){if(len+t.length>380&&cur.length){chunks.push(cur);cur=[];len=0;}cur.push(t);len+=t.length+1;});
  if(cur.length)chunks.push(cur);
  return Promise.all(chunks.map(function(c){
    return fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(c.join("\n"))+"&langpair="+from+"|"+to)
      .then(function(r){return r.json();})
      .then(function(d){
        var out=d&&d.responseStatus===200&&d.responseData?String(d.responseData.translatedText).split("\n"):null;
        return out&&out.length===c.length?out:c;
      }).catch(function(){return c;});
  })).then(function(parts){return [].concat.apply([],parts);});
}

/* Appel au proxy en flux : onText reçoit le texte au fur et à mesure */
function aiStream(prompt,onText,bucket){
  var ctl=new AbortController();bucket.push(ctl);

  function done(){clearTimeout(t);var i=bucket.indexOf(ctl);if(i>-1)bucket.splice(i,1);}
  return fetch(AI_PROXY,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({mode:AI_MODE,messages:[{role:"user",content:prompt}],stream:true}),signal:ctl.signal})
  .then(function(r){
    if(!r.ok)return r.text().then(function(x){throw new Error("HTTP "+r.status+" "+x.slice(0,120));});
    var acc="",raw="",buf="";
    function eat(line){
      var l=line.trim();if(l.indexOf("data:")!==0)return;
      var d=l.slice(5).trim();if(!d||d==="[DONE]")return;
      try{var j=JSON.parse(d);var c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(c){acc+=c;if(onText)onText(acc);}}catch(e){}

      return acc;
    }
    if(!r.body||!r.body.getReader)return r.text().then(function(x){raw=x;x.split("\n").forEach(eat);return fin();});
    var rd=r.body.getReader(),dec=new TextDecoder();

        var chunk=dec.decode(res.value,{stream:true});raw+=chunk;buf+=chunk;
        var lines=buf.split("\n");buf=lines.pop();lines.forEach(eat);

      });
    }

  }).then(function(x){done();return x;},function(e){done();throw new Error(e&&e.name==="AbortError"?"Délai dépassé":(e&&e.message)||"Réseau");});
}

function aiObjs(text){
  text=aiClean(text);

  var out=[],depth=0,start=-1,inStr=false,esc=false;
  for(var k=i+1;k<text.length;k++){

    if(inStr){if(esc)esc=false;else if(c==="\\")esc=true;else if(c==='"')inStr=false;continue;}
    if(c==='"'){inStr=true;continue;}
    if(c==="{"){if(depth===0)start=k;depth++;}
    else if(c==="}"){depth--;if(depth===0&&start>=0){try{out.push(JSON.parse(text.slice(start,k+1)));}catch(e){}start=-1;}}

}

  if(!cats){aiS.items=[];aiS.catErr={};}else cats.forEach(function(c){delete aiS.catErr[c];});
  aiS.inDetail=false;aiS.err="";aiS.detail=null;aiS.running=plan.length;
  aiRender();

  function addItem(o,cat){
    if(!o)return;
    var nom=String(o.nom||o.name||o.titre||"").trim();if(!nom)return;
    var low=nom.toLowerCase();
    if(aiS.items.some(function(x){return x.cat===cat&&x.nom.toLowerCase()===low;}))return;
    aiS.items.push({nom:nom,cat:cat,description:String(o.description||"").trim(),temps:String(o.temps||"").trim()});
    added.push(nom);
  }
  function finish(){
    if(!aiS.items.length&&more&&prev.length){aiS.items=prev;aiS.catErr={};toast("Impossible de générer d’autres recettes");}
    else if(aiS.items.length)aiListCache[key]=aiS.items.slice();
    aiSeen[key]=seen.concat(added);
    aiRenderResults();aiRenderFoot();
  }
  plan.forEach(function(cat){
    var shown=0,tried=0;
    function once(){
      tried++;
      return aiStream(aiListPrompt(q,cat,per,seen),function(txt){
        if(my!==aiS.rl)return;
        var objs=aiObjs(txt);
        for(;shown<objs.length;shown++)addItem(objs[shown],cat);
        aiResultsSoon();
      },aiS.lctls).then(function(txt){
        if(my!==aiS.rl)return;
        var objs=aiObjs(txt);
        for(;shown<objs.length;shown++)addItem(objs[shown],cat);
        if(!shown)throw new Error("Réponse illisible");
      }).catch(function(e){
        if(my!==aiS.rl)return;
        if(!shown&&tried<2)return once();
        throw e;
      });
    }
    once().catch(function(e){
      if(my!==aiS.rl)return;
      aiS.catErr[cat]=e.message||"Erreur";
    }).then(function(){
      if(my!==aiS.rl)return;
      aiS.running--;
      if(aiS.running<=0){aiS.running=0;finish();}else aiResultsSoon();
    });
  });
}

/* détail : les ingrédients s'affichent dès qu'ils arrivent, puis les étapes */
function aiDetail(name,cat){
  aiAbort(aiS.dctls);
  var my=++aiS.rd;aiS.dName=name;aiS.dCat=cat||"";aiS.err="";
  if(aiDetailCache[name]){aiS.detail=aiDetailCache[name];aiS.dLoading=false;aiRender();return;}
  aiS.dLoading=true;aiS.detail=null;aiRender();
  var prompt="Donne la recette « "+name+" » pour 4 personnes. "+appliancesText()+" Réponds UNIQUEMENT avec un objet JSON, sans texte autour ni markdown, dans cet ordre : "+
    '{"personnes":4,"ingredients":["400 g de pâtes","3 tomates","1 oignon"],"etapes":["Première étape","Deuxième étape"]}. '+
    "Chaque ingrédient sur une chaîne, la quantité d’abord puis l’ingrédient, avec les unités g, kg, ml, cl ou l. Étapes courtes (une phrase), 8 au maximum.";
  function build(txt){
    var ing=aiArr(txt,"ingredients");if(!ing||!ing.length)return null;
    var st=aiArr(txt,"etapes"),pm=/"personnes"\s*:\s*"?(\d+)/.exec(txt);
    return {nom:name,cat:normCat(cat,name),personnes:Math.max(1,pm?parseInt(pm[1],10):4),
      ing:ing.map(aiLine).filter(Boolean),
      steps:(st||[]).map(aiLine).map(function(x){return x.replace(/^\s*\d+\s*[.)\-:]\s*/,"");}).filter(Boolean),
      partial:!st};
  }
  var tried=0;
  function once(){
    tried++;
    return aiStream(prompt,function(txt){
      if(my!==aiS.rd)return;
      var d=build(txt);if(!d)return;
      var c=aiS.detail;
      if(!c||c.ing.length!==d.ing.length||c.steps.length!==d.steps.length||c.partial!==d.partial){
        aiS.detail=d;aiS.dLoading=false;aiRender(true);
      }
    },aiS.dctls).then(function(txt){
      if(my!==aiS.rd)return;
      var d=build(txt);if(!d)throw new Error("Recette illisible, réessaie");
      d.partial=false;aiDetailCache[name]=d;aiS.detail=d;aiS.dLoading=false;aiRender(true);
    }).catch(function(e){
      if(my!==aiS.rd)return;
      if(!aiS.detail&&tried<2)return once();
      throw e;
    });
  }
  once().catch(function(e){
    if(my!==aiS.rd)return;
    aiS.dLoading=false;aiS.err=e.message||"Erreur";aiRender();
  });
}

function isFav(nom){return state.favs.some(function(f){return f.nom===nom;});}
function toggleFav(d){
  if(isFav(d.nom))state.favs=state.favs.filter(function(f){return f.nom!==d.nom;});
  else state.favs.push({nom:d.nom,cat:d.cat||catOfName(d.nom),personnes:d.personnes,ing:d.ing.slice(),steps:d.steps.slice()});
  save();aiRender(true);
}
function stepsText(d){return d.steps.map(function(x,i){return (i+1)+". "+x;}).join("\n");}
function aiUse(){
  var d=aiS.detail;if(!d)return;
  document.getElementById("f-name").value=d.nom;
  document.getElementById("f-ing").value=d.ing.join("\n");
  document.getElementById("f-steps").value=stepsText(d);
  document.getElementById("f-base").value=d.personnes;
  saveDraft();aiClose();toast("Recette ajoutée au formulaire");
}
function aiAddToMenu(day,slot){
  var d=aiS.detail;if(!d)return;
  var k=day+"-"+slot;
  if(state.meals[k]&&!confirm("Ce créneau est déjà rempli. Le remplacer ?"))return;
  state.meals[k]={name:d.nom,ing:d.ing.join("\n"),steps:stepsText(d),base:d.personnes,people:state.people||2};
  save();aiClose();go("week");toast("Repas ajouté au menu");
}
function aiEditMeal(){var k=aiS.mealKey;aiClose();openSheet(k,keyTitle(k));}

function aiRec(box,r,onpick){
  var b=el("button","rec");b.type="button";
  b.appendChild(el("strong","",r.nom));
  var sub=r.personnes?"Pour "+r.personnes+" personnes":[r.temps,r.description].filter(Boolean).join(" · ");
  if(sub)b.appendChild(el("small","",sub));
  b.addEventListener("click",onpick);
  box.appendChild(b);
}
function aiGrouped(box,items,onpick){
  CATS.forEach(function(c){
    var xs=items.filter(function(r){return (r.cat||"Plat")===c;});
    if(!xs.length)return;
    box.appendChild(el("h2","aisle",CATPL[c]+" ("+xs.length+")"));
    xs.forEach(function(r){aiRec(box,r,function(){onpick(r);});});
  });
}

function aiRender(keep){
  var st=keep?aiPanel.scrollTop:0;
  aiPanel.replaceChildren();
  if(aiS.view==="meal")aiRenderMeal();
  else if(aiS.inDetail)aiRenderDetail();
  else if(aiS.view==="fav")aiRenderFav();
  else aiRenderSearch();
  aiRenderFoot();
  aiPanel.scrollTop=st;
}

function aiRenderFoot(){
  aiFoot.replaceChildren();
  function btn(t,cls,fn){var b=el("button","btn"+(cls?" "+cls:""),t);b.type="button";b.addEventListener("click",fn);aiFoot.appendChild(b);}
  if(aiS.view==="meal"){
    btn("Fermer","",aiClose);btn("Modifier","main",aiEditMeal);
  }else if(aiS.inDetail){
    btn("‹ Retour","",aiBack);
    var d=aiS.detail;
    if(d&&!d.partial&&!aiS.dLoading&&!aiS.err){
      if(aiS.ctx==="sheet")btn("Utiliser cette recette","main",aiUse);
      else btn("Ajouter au menu","main",function(){if(aiDaySel&&aiSlotSel)aiAddToMenu(+aiDaySel.value,aiSlotSel.value);});
    }
  }else if(aiS.view==="fav"){
    btn("‹ Retour","",function(){aiS.view="search";aiRender();});btn("Fermer","",aiClose);
  }else{
    btn("Fermer","",aiClose);
    if(aiS.items.length&&aiS.running===0)btn("↻ Générer d’autres","main",function(){aiSearch(true);});
  }
  aiFoot.hidden=!aiFoot.children.length;
}

function aiRenderMeal(){
  var m=state.meals[aiS.mealKey];
  if(!m){aiClose();return;}
  aiPanel.appendChild(el("h3","",m.name||"Repas"));
  var f=(m.people&&m.base)?m.people/m.base:1;
  aiPanel.appendChild(el("p","hint",keyTitle(aiS.mealKey)+(m.people?" · pour "+m.people+" personnes":"")));
  var ings=(m.ing||"").split("\n").filter(function(l){return l.trim();});
  if(ings.length){
    aiPanel.appendChild(el("h2","aisle","Ingrédients"));
    ings.forEach(function(l){aiPanel.appendChild(el("div","ingl",scaledLine(l,f)));});
  }
  aiPanel.appendChild(el("h2","aisle","Étapes"));
  var st=(m.steps||"").split("\n").filter(function(l){return l.trim();});
  if(st.length)st.forEach(function(l){aiPanel.appendChild(el("p","stepl",l.trim()));});
  else aiPanel.appendChild(el("p","hint","Pas d’étapes enregistrées pour ce repas."));
}

function aiRenderDetail(){
  if(aiS.dLoading){aiPanel.appendChild(el("p","note","Je prépare la recette « "+aiS.dName+" »…"));return;}
  if(aiS.err||!aiS.detail){
    aiPanel.appendChild(el("p","note","Impossible : "+(aiS.err||"recette introuvable")));
    var rt=el("button","btn main","Réessayer");rt.type="button";rt.style.width="100%";
    rt.addEventListener("click",function(){aiDetail(aiS.dName,aiS.dCat);});aiPanel.appendChild(rt);
    return;
  }
  var d=aiS.detail;
  aiPanel.appendChild(el("h3","",d.nom));
  aiPanel.appendChild(el("p","hint",(d.cat||"Plat")+" · pour "+d.personnes+" personnes"));
  if(!d.partial){
    var fv=el("button","btn",isFav(d.nom)?"★ Retirer des favoris":"☆ Ajouter aux favoris");fv.type="button";fv.style.width="100%";
    fv.addEventListener("click",function(){toggleFav(d);});aiPanel.appendChild(fv);
  }
  aiPanel.appendChild(el("h2","aisle","Ingrédients"));
  d.ing.forEach(function(x){aiPanel.appendChild(el("div","ingl",x));});
  aiPanel.appendChild(el("h2","aisle","Étapes"));
  if(d.partial&&!d.steps.length)aiPanel.appendChild(el("p","hint","Rédaction des étapes…"));
  else{var ol=el("ol","steps");d.steps.forEach(function(x){ol.appendChild(el("li","",x));});aiPanel.appendChild(ol);}
  aiDaySel=aiSlotSel=null;
  if(!d.partial&&aiS.ctx==="ideas"){
    var fr=nextFree({}),row=el("div","assign");
    aiDaySel=sel("",DAYS.map(function(x,i){return [i,x];}),fr.day,"Jour",function(){});
    aiSlotSel=sel("",SLOTS,fr.slot,"Repas",function(){});
    row.appendChild(aiDaySel);row.appendChild(aiSlotSel);aiPanel.appendChild(row);
  }
}

function aiRenderFav(){
  aiPanel.appendChild(el("h3","","Mes favoris"));
  if(!state.favs.length){aiPanel.appendChild(el("p","note","Aucun favori pour l’instant. Ouvre une recette et touche « Ajouter aux favoris »."));return;}
  aiGrouped(aiPanel,state.favs,function(r){aiS.inDetail=true;aiS.err="";aiS.dLoading=false;aiS.detail=r;aiRender();});
}

function aiRenderSearch(){
  aiPanel.appendChild(el("h3","","AI Hub · recettes"));
  var lab=el("label","","Plat ou ingrédients");lab.htmlFor="ai-q";lab.style.marginTop="0";
  var inp=document.createElement("input");inp.type="text";inp.id="ai-q";inp.value=aiS.q;inp.placeholder="Ex. : poulet, riz, courgette";inp.autocomplete="off";
  inp.addEventListener("input",function(){aiS.q=inp.value;});
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();aiSearch(false);}});
  aiPanel.appendChild(lab);aiPanel.appendChild(inp);
  var bar=el("div","bar");bar.style.marginTop="10px";
  var go1=el("button","btn main","Chercher");go1.type="button";go1.addEventListener("click",function(){aiSearch(false);});
  var fv=el("button","btn","★ Favoris ("+state.favs.length+")");fv.type="button";fv.addEventListener("click",function(){aiS.view="fav";aiRender();});
  bar.appendChild(go1);bar.appendChild(fv);aiPanel.appendChild(bar);
  var box=el("div","");box.id="ai-results";aiPanel.appendChild(box);
  aiRenderResults();
}

function aiRenderResults(){
  var box=document.getElementById("ai-results");if(!box)return;
  box.replaceChildren();
  var busy=aiS.running>0,bad=Object.keys(aiS.catErr);
  if(!aiS.items.length){
    if(busy)box.appendChild(el("p","note","L’IA cherche des recettes…"));
    else if(bad.length){
      box.appendChild(el("p","note","Impossible : "+aiS.catErr[bad[0]]));
      var rt=el("button","btn main","Réessayer");rt.type="button";rt.style.width="100%";
      rt.addEventListener("click",function(){aiSearch(false);});box.appendChild(rt);
    }
    return;
  }
  aiGrouped(box,aiS.items,function(r){aiS.inDetail=true;aiDetail(r.nom,r.cat);});
  if(busy)box.appendChild(el("p","hint","D’autres recettes arrivent…"));
  else if(bad.length){
    box.appendChild(el("p","note","Impossible de charger : "+bad.map(function(c){return CATPL[c];}).join(", ")));
    var rb=el("button","btn","Réessayer");rb.type="button";rb.style.width="100%";
    rb.addEventListener("click",function(){aiSearch(false,bad);});box.appendChild(rb);
  }
}
document.getElementById("f-ai").addEventListener("click",function(){
  aiOpen("sheet",document.getElementById("f-name").value.trim());
});

/* --- Web Share Target --- */
function checkSharedTarget() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('share') === 'true') {
    let sharedUrl = params.get('url') || params.get('text') || '';
    const match = sharedUrl.match(/https?:\/\/[^\s]+/);
    if (match) sharedUrl = match[0];

    if (sharedUrl && sharedUrl.includes('marmiton.org')) {
      go("week");
      setTimeout(() => {
        openSheet("0-m", "Lundi, midi");
        document.getElementById("f-url").value = sharedUrl;
        document.getElementById("f-import").click();
      }, 100);
    }
  }
}

  var blob=new Blob([sw],{type:"text/javascript"});

}
